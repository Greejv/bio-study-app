<style>
/* Layout: jeden stĺpec ako stránka produktu Apple. Biela plocha, obsah v zaoblených sivých skupinách (ako Nastavenia v iOS),
   jeden font, modrá len pre akcie, červená/modrá/fialová len pre krv. */
:root {
  --bg: #FFFFFF;
  --group: #F5F5F7;
  --fill: #E8E8ED;
  --sep: #D2D2D7;
  --ink: #1D1D1F;
  --muted: #6E6E73;
  --accent: #0071E3;
  --accent-ink: #FFFFFF;
  --link: #0066CC;
  --green: #248A3D;
  --red: #D70015;
  --bar: rgba(255,255,255,.78);
  --oxy: #D3263F;
  --deoxy: #2F6BD8;
  --mix: #8A4FC2;
  --hemo: #B07D0A;
  --pale: #8E8E93;
  --sheet: #F5F5F7;
  --paper: #FFFFFF;
  --pen: #6E6E73;
  --font: "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r-lg: 22px;
  --r-md: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --group: #1C1C1E; --fill: #2C2C2E; --sep: #38383A; --ink: #F5F5F7; --muted: #98989D;
    --accent: #2997FF; --accent-ink: #000000; --link: #2997FF; --green: #30D158; --red: #FF453A; --bar: rgba(0,0,0,.72);
    --oxy: #FF5A6E; --deoxy: #6E9BFF; --mix: #BF8BF0; --hemo: #E3B341; --pale: #8E8E93; --sheet: #1C1C1E; --paper: #000000; --pen: #98989D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --group: #1C1C1E; --fill: #2C2C2E; --sep: #38383A; --ink: #F5F5F7; --muted: #98989D;
  --accent: #2997FF; --accent-ink: #000000; --link: #2997FF; --green: #30D158; --red: #FF453A; --bar: rgba(0,0,0,.72);
  --oxy: #FF5A6E; --deoxy: #6E9BFF; --mix: #BF8BF0; --hemo: #E3B341; --pale: #8E8E93; --sheet: #1C1C1E; --paper: #000000; --pen: #98989D;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 18px; line-height: 1.6; letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
.wrap { max-width: 680px; margin: 0 auto; padding-block: 0 64px; }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }
h1 { font-size: clamp(2.4rem, 8vw, 3.5rem); line-height: 1.05; }
h2 { font-size: clamp(1.6rem, 5vw, 2rem); line-height: 1.15; }
h3 { font-size: 1.2rem; line-height: 1.3; }
p { margin: 0; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
b, strong { font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.stack { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 8px; }

/* horný panel */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 52px; margin: 0 calc(-1 * max(20px, env(safe-area-inset-left, 0px))) 8px; padding: 0 max(20px, env(safe-area-inset-left, 0px)); background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid color-mix(in srgb, var(--sep) 60%, transparent); }
.brand { font-weight: 700; font-size: 1.05rem; color: var(--ink); letter-spacing: -0.02em; }
.brand:hover { text-decoration: none; }
.brand span { color: var(--oxy); }
.toplinks { display: flex; gap: 20px; font-size: .92rem; }
.toplinks a { color: var(--ink); opacity: .8; }

/* tlačidlá */
button { font: inherit; color: inherit; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 24px; border-radius: 980px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 500; font-size: 1rem; cursor: pointer; text-decoration: none; transition: filter .15s, transform .1s; }
.btn:hover { filter: brightness(1.08); text-decoration: none; }
.btn:active { transform: scale(.98); }
.btn.ghost { background: var(--fill); color: var(--ink); }
.btn[disabled] { opacity: .35; cursor: not-allowed; filter: none; }
.btn.wide { width: 100%; }

/* domov */
.intro { display: grid; gap: 18px; padding-block: 40px 16px; text-align: left; }
.subject { color: var(--oxy); font-weight: 600; font-size: 1rem; }
.intro h1 .beat { color: var(--oxy); }
.lede { font-size: 1.2rem; color: var(--muted); max-width: 32em; line-height: 1.5; }
.state { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.tally { color: var(--muted); font-size: .95rem; }
.sec { margin: 56px 0 14px; }
.sec .marg { display: none; }
.toc, .tasks { list-style: none; margin: 0; padding: 0; background: var(--group); border-radius: var(--r-lg); overflow: hidden; }
.toc li { position: relative; display: grid; grid-template-columns: 64px 1fr; align-items: center; }
.toc li + li::after, .tasks li + li::after { content: ""; position: absolute; top: 0; left: 64px; right: 0; height: 1px; background: var(--sep); opacity: .7; }
.tasks li { position: relative; }
.tasks li + li::after { left: 20px; }
.marg { font-size: .78rem; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; line-height: 1.2; }
.toc a { display: flex; align-items: center; gap: 10px; padding: 14px 18px 14px 0; color: var(--ink); min-width: 0; }
.toc a:hover { text-decoration: none; }
.toc a:hover .t strong { color: var(--accent); }
.toc .num { display: none; }
.toc .t { min-width: 0; flex: 1; }
.toc .t strong { display: block; font-size: 1.05rem; }
.toc .t small { display: block; font-size: .88rem; color: var(--muted); line-height: 1.35; }
.toc .dots { display: none; }
.toc .kind { font-size: .85rem; color: var(--muted); white-space: nowrap; }
.toc .kind::after { content: "›"; margin-left: 10px; font-size: 1.2rem; color: var(--sep); }
.toc .tick { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 50%; background: var(--green); color: #fff; font-size: .75rem; display: grid; place-items: center; font-weight: 700; }
.toc li.done .marg { visibility: hidden; }
.toc li.next .t strong { color: var(--accent); }
@media (max-width: 560px) { .toc .kind { display: none; } }
.pen-note { font-size: .9rem; color: var(--muted); margin-top: 14px; padding: 0 4px; }
.pen-note b { color: var(--ink); }
.tasks { counter-reset: u; }
.tasks li { counter-increment: u; }
.tasks a { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; padding: 16px 20px; color: var(--ink); align-items: center; }
.tasks a:hover { text-decoration: none; }
.tasks a:hover strong { color: var(--accent); }
.tasks strong { font-size: 1.05rem; }
.tasks span { grid-column: 1; font-size: .9rem; color: var(--muted); line-height: 1.4; }
.tasks em { grid-column: 2; grid-row: 1 / span 2; font-style: normal; font-size: .85rem; color: var(--muted); white-space: nowrap; }
.tasks em::after { content: "›"; margin-left: 10px; font-size: 1.2rem; color: var(--sep); }
.methods { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.methods li { min-width: 0; background: var(--group); border-radius: var(--r-md); padding: 16px 18px; font-size: .92rem; color: var(--muted); line-height: 1.45; }
.methods b { display: block; color: var(--ink); font-size: 1rem; margin-bottom: 4px; }
@media (max-width: 560px) { .methods { grid-template-columns: 1fr; } }

/* stanica */
.pagehead { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 12px; }
.pagehead a { font-size: .95rem; }
.pageno { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.kicker { color: var(--muted); font-size: .92rem; font-weight: 500; }
.method { font-size: .88rem; color: var(--muted); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; line-height: 1.45; }
.method b { display: inline-block; font-size: .72rem; font-weight: 600; letter-spacing: .02em; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); padding: 3px 9px; border-radius: 980px; }
.lead { font-size: 1.2rem; line-height: 1.5; }
.q { font-size: 1.35rem; font-weight: 600; line-height: 1.3; letter-spacing: -0.015em; }
.opts { display: flex; flex-direction: column; background: var(--group); border-radius: var(--r-md); overflow: hidden; }
.opt { position: relative; text-align: left; display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 4px; padding: 15px 16px; border: 0; background: transparent; cursor: pointer; line-height: 1.4; font-size: 1.02rem; }
.opt + .opt::before { content: ""; position: absolute; top: 0; left: 46px; right: 0; height: 1px; background: var(--sep); opacity: .7; }
.opt:hover:not([disabled]) { background: var(--fill); }
.opt .k { color: var(--muted); font-weight: 500; font-size: .95rem; }
.opt .ring { display: none; }
.opt .mark { order: 3; color: var(--green); font-weight: 700; font-size: 1.1rem; }
.opt[disabled] { cursor: default; }
.opt.right { background: color-mix(in srgb, var(--green) 12%, var(--group)); }
.opt.right .txt { color: var(--ink); font-weight: 500; }
.opt.wrong { background: color-mix(in srgb, var(--red) 10%, var(--group)); }
.opt.wrong .txt { color: var(--red); }
.opt.dim .txt { color: var(--muted); }
.feedback { background: var(--group); border-radius: var(--r-md); padding: 16px 18px; font-size: 1rem; line-height: 1.55; }
.feedback .verdict { display: block; font-weight: 600; color: var(--red); margin-bottom: 4px; }
.feedback.good .verdict { color: var(--green); }
.points { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0; background: var(--group); border-radius: var(--r-lg); counter-reset: p; }
.points li { counter-increment: p; display: grid; grid-template-columns: 34px 1fr; padding: 16px 20px 16px 16px; position: relative; line-height: 1.55; }
.points li + li::after { content: ""; position: absolute; top: 0; left: 50px; right: 0; height: 1px; background: var(--sep); opacity: .7; }
.points li::before { content: counter(p); width: 24px; height: 24px; border-radius: 50%; background: var(--fill); color: var(--muted); font-size: .8rem; font-weight: 600; display: grid; place-items: center; margin-top: 2px; }
figure { margin: 0; background: var(--group); border-radius: var(--r-lg); padding: 20px 16px 18px; }
figcaption { font-size: .95rem; color: var(--muted); margin-top: 12px; line-height: 1.5; }
figcaption b { color: var(--ink); }
.diagram { width: 100%; overflow-x: auto; }
.diagram svg { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .88rem; color: var(--muted); margin-top: 10px; justify-content: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.think { background: var(--group); border-radius: var(--r-md); padding: 18px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; color: var(--muted); }
.remember-box { background: var(--group); border-radius: var(--r-lg); padding: 24px 24px 26px; margin-top: 8px; }
.remember-box .tag { display: block; font-size: .85rem; font-weight: 600; color: var(--oxy); margin-bottom: 8px; }
.remember { font-size: clamp(1.45rem, 4.6vw, 1.85rem); font-weight: 700; line-height: 1.25; letter-spacing: -0.02em; }
.navbar { position: sticky; bottom: 0; z-index: 4; display: flex; gap: 10px; justify-content: space-between; margin: 28px calc(-1 * max(20px, env(safe-area-inset-left, 0px))) 0; padding: 12px max(20px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: 1px solid color-mix(in srgb, var(--sep) 60%, transparent); }
.navbar .btn { flex: 1; max-width: 220px; }
.navbar .btn:last-child { margin-left: auto; }
.kbd { font-size: .78rem; color: var(--muted); text-align: center; margin-top: 8px; }
@media (hover: none) { .kbd { display: none; } }

/* schémy */
.sv text { font-family: var(--font); fill: var(--ink); font-size: 12px; }
.sv .lbl { font-size: 10.5px; fill: var(--muted); }
.sv .ttl { font-weight: 600; font-size: 12.5px; }
.sv [filter] { filter: none; }
.sv .organ { fill: var(--bg); stroke: var(--sep); stroke-width: 1.2; }
.sv .wall { fill: none; stroke: var(--muted); stroke-width: 1.4; }
.sv .faint { fill: var(--bg); stroke: var(--sep); stroke-width: 1.4; }
.sv .sept { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; }
.sv .ch-oxy { fill: color-mix(in srgb, var(--oxy) 16%, var(--bg)); stroke: var(--oxy); stroke-width: 1.4; }
.sv .ch-deoxy { fill: color-mix(in srgb, var(--deoxy) 16%, var(--bg)); stroke: var(--deoxy); stroke-width: 1.4; }
.sv .ch-mix { fill: color-mix(in srgb, var(--mix) 18%, var(--bg)); stroke: var(--mix); stroke-width: 1.4; }
.sv .ch-mixb { fill: color-mix(in srgb, color-mix(in srgb, var(--deoxy) 65%, var(--mix)) 18%, var(--bg)); stroke: color-mix(in srgb, var(--deoxy) 65%, var(--mix)); stroke-width: 1.4; }
.sv .ch-mixr { fill: color-mix(in srgb, color-mix(in srgb, var(--oxy) 65%, var(--mix)) 18%, var(--bg)); stroke: color-mix(in srgb, var(--oxy) 65%, var(--mix)); stroke-width: 1.4; }
.sv .ch-hemo { fill: color-mix(in srgb, var(--hemo) 20%, var(--bg)); stroke: var(--hemo); stroke-width: 1.4; }
.sv .track { fill: none; stroke-width: 4.5; stroke-linejoin: round; opacity: .25; }
.sv .flow { fill: none; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 11; animation: flow 1.1s linear infinite; }
.sv .s-oxy { stroke: var(--oxy); } .sv .f-oxy { fill: var(--oxy); }
.sv .s-deoxy { stroke: var(--deoxy); } .sv .f-deoxy { fill: var(--deoxy); }
.sv .s-mix { stroke: var(--mix); } .sv .f-mix { fill: var(--mix); }
.sv .s-mixb { stroke: color-mix(in srgb, var(--deoxy) 65%, var(--mix)); } .sv .f-mixb { fill: color-mix(in srgb, var(--deoxy) 65%, var(--mix)); }
.sv .s-mixr { stroke: color-mix(in srgb, var(--oxy) 65%, var(--mix)); } .sv .f-mixr { fill: color-mix(in srgb, var(--oxy) 65%, var(--mix)); }
.sv .s-hemo { stroke: var(--hemo); } .sv .f-hemo { fill: var(--hemo); }
.sv .s-pale { stroke: var(--pale); } .sv .f-pale { fill: var(--pale); }
.sv .s-ink { stroke: var(--muted); } .sv .f-ink { fill: var(--muted); }
.sv .s-blank { stroke: var(--muted); } .sv .f-blank { fill: var(--muted); }
.sv .hit { fill: none; stroke: transparent; stroke-width: 22; cursor: pointer; pointer-events: stroke; }
.sv .paint { cursor: pointer; }
.sv .bad { stroke: var(--red) !important; stroke-dasharray: 4 3; stroke-width: 2.5 !important; }
.sv .pulse { animation: pulse 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.sv .dot { animation: drift 2.6s ease-out infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }
@keyframes pulse { 50% { transform: scale(1.12); } }
@keyframes drift { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; } }

/* hry */
.choice { display: inline-flex; background: var(--fill); border-radius: 10px; padding: 3px; gap: 2px; align-self: flex-start; }
.choice button { border: 0; background: transparent; padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: .95rem; font-weight: 500; color: var(--ink); }
.choice button.on { background: var(--bg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.path { list-style: none; margin: 0; padding: 0; background: var(--group); border-radius: var(--r-md); overflow: hidden; }
.path li { display: grid; grid-template-columns: 26px 14px 1fr; align-items: center; gap: 10px; padding: 11px 16px; position: relative; }
.path li + li::before { content: ""; position: absolute; top: 0; left: 66px; right: 0; height: 1px; background: var(--sep); opacity: .7; }
.path li .n { color: var(--muted); font-size: .85rem; text-align: right; font-variant-numeric: tabular-nums; }
.path li .d { width: 12px; height: 12px; border-radius: 50%; }
.path li.slot .d { border: 2px dashed var(--sep); }
.path li.slot .txt { color: var(--muted); }
.pool, .bank { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { padding: 10px 16px; border-radius: 980px; border: 0; background: var(--fill); cursor: pointer; font-weight: 500; font-size: .98rem; }
.tile:hover { background: color-mix(in srgb, var(--accent) 14%, var(--fill)); }
.tile[disabled] { opacity: .3; cursor: default; }
.tile.shake { animation: shake .35s; background: color-mix(in srgb, var(--red) 16%, var(--fill)); }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.hint { font-size: .98rem; color: var(--ink); background: color-mix(in srgb, var(--red) 8%, var(--group)); border-radius: var(--r-md); padding: 14px 16px; }
.animal { font-size: clamp(2.4rem, 9vw, 3.4rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
.cats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
@media (max-width: 520px) { .cats { grid-template-columns: 1fr; } }

.flash { position: relative; display: flex; flex-direction: column; gap: 16px; justify-content: center; min-height: 280px; padding: 48px 26px 30px; text-align: left; cursor: pointer; border: 0; border-radius: var(--r-lg); background: var(--group); width: 100%; user-select: none; }
.flash .side { position: absolute; top: 18px; left: 26px; font-size: .82rem; color: var(--muted); font-weight: 500; }
.flash .fq { font-size: clamp(1.35rem, 4.4vw, 1.65rem); font-weight: 700; line-height: 1.25; letter-spacing: -0.02em; }
.flash .fa { font-size: 1.1rem; line-height: 1.5; color: var(--ink); padding-top: 16px; border-top: 1px solid var(--sep); }
.boxes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.boxes div { background: var(--group); border-radius: var(--r-md); padding: 12px 14px; font-size: .8rem; color: var(--muted); }
.boxes b { display: block; font-size: 1.5rem; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.2; }
.boxes div:last-child b { color: var(--green); }

.grade { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; background: var(--group); border-radius: var(--r-lg); padding: 22px; }
.grade .mk { position: relative; width: 88px; height: 88px; display: grid; place-items: center; font-size: 3rem; font-weight: 700; color: var(--accent-ink); background: var(--accent); border-radius: 50%; }
.grade .mk svg { display: none; }
.grade .pts { font-size: 1.15rem; font-weight: 600; }
.miss-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; background: var(--group); border-radius: var(--r-lg); overflow: hidden; }
.miss-list li { padding: 16px 18px; font-size: .98rem; line-height: 1.5; position: relative; }
.miss-list li + li::before { content: ""; position: absolute; top: 0; left: 18px; right: 0; height: 1px; background: var(--sep); opacity: .7; }
.miss-list .fix { color: var(--green); font-weight: 600; }

.cloze { font-size: 1.2rem; line-height: 2.4; background: var(--group); border-radius: var(--r-lg); padding: 18px 22px; }
.gap { display: inline-block; min-width: 5.5em; border: 0; border-radius: 8px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--sep); padding: 2px 10px; margin: 0 2px; font-weight: 600; font-size: 1.05rem; line-height: 1.5; cursor: pointer; text-align: center; color: var(--ink); }
.gap.empty { color: var(--muted); font-weight: 400; }
.gap.ok { box-shadow: inset 0 0 0 1.5px var(--green); color: var(--green); }
.gap.no { box-shadow: inset 0 0 0 1.5px var(--red); color: var(--red); text-decoration: line-through; }

const doneCount = () => STATIONS.filter(s => S.done[s.id]).length;
const nextStation = () => STATIONS.find(s => !S.done[s.id]);
const learned = () => CARDS.filter((_, i) => (S.boxes[i] || 0) >= 3).length;
const go = (h) => { location.hash = h; };

/* =========================================================
   SCHÉMY (SVG)
   ========================================================= */
let uid = 0, CURP = "";
function markers(p) {
  return `<defs>${["oxy","deoxy","mix","mixb","mixr","hemo","pale","ink","blank"].map(c =>
    `<marker id="${p}-${c}" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" class="f-${c}"/></marker>`).join("")}<filter id="${p}-rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter></defs>`;
}
function flow(p, d, c) { return `<path d="${d}" class="track s-${c}"/><path d="${d}" class="flow s-${c}" marker-end="url(#${p}-${c})"/>`; }
function box(x, y, w, h, cls, l1, l2) {
  const cx = x + w / 2, cy = y + h / 2;
  const t = l2 ? `<text x="${cx}" y="${cy - 2}" text-anchor="middle" class="ttl">${l1}</text><text x="${cx}" y="${cy + 12}" text-anchor="middle" class="lbl">${l2}</text>`
               : `<text x="${cx}" y="${cy + 4}" text-anchor="middle" class="ttl">${l1}</text>`;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" class="${cls}" filter="url(#${CURP}-rough)"/>${t}`;
}
function vlabel(x, y, t, anchor = "middle") { return `<text x="${x}" y="${y}" class="lbl" text-anchor="${anchor}" transform="rotate(-90 ${x} ${y})">${t}</text>`; }

function diagram(type, paint) {

      `<circle cx="180" cy="${140 + (i%3)*12 - 10}" r="3.2" class="f-deoxy dot" style="--dx:${dx*1.6}px;--dy:${dy}px;animation-delay:${i*0.42}s"/>`).join("");
    return open("0 0 360 260", "Nezmar v reze, difúzia z dutiny do buniek") +

       <rect x="120" y="70" width="190" height="16" rx="8" class="ch-hemo pulse"/>
       ${[160,200,240,280].map(x => `<path d="M${x-5} 88 L${x} 82 L${x+5} 88" fill="none" class="s-ink" stroke-width="1.5"/>`).join("")}

       <text x="222" y="108" class="lbl">ostiá</text>
       <text x="20" y="60" class="lbl">aorta → hlava</text>
       <text x="160" y="214" text-anchor="middle" class="lbl">hemocél (telová dutina) – hemolymfa obmýva orgány</text>
       <text x="20" y="34" class="lbl">◀ vpredu</text><text x="340" y="34" text-anchor="end" class="lbl">vzadu ▶</text></svg>`;
  }
  if (type === "worm") {
    const rings = [70, 92, 114, 136, 158].map(x => `<path d="M${x} 74 L${x} 126" class="s-oxy pulse" stroke-width="4" stroke-linecap="round" marker-end="url(#${p}-oxy)"/>`).join("");
    return open("0 0 360 200", "Uzavretá obehová sústava dážďovky") +
      `<rect x="16" y="40" width="328" height="120" rx="60" class="faint" filter="url(#${p}-rough)"/>
       ${[200,220,240,260,280,300].map(x => `<line x1="${x}" y1="44" x2="${x}" y2="156" class="s-ink" stroke-width=".6" opacity=".35"/>`).join("")}
       ${flow(p, "M330 66 L44 66", "oxy")}

  }
  if (type === "lancelet") {
    return open("0 0 360 200", "Obehová sústava kopijovca") +
      `<path d="M16 100 C80 54 260 50 344 100 C260 150 80 146 16 100 Z" class="faint" filter="url(#${p}-rough)"/>
       ${[74,92,110,128,146].map(x => `<line x1="${x-6}" y1="84" x2="${x+6}" y2="116" class="s-ink" stroke-width="1.2" opacity=".5"/>`).join("")}
       ${flow(p, "M290 124 L60 124", "pale")}
       ${[80,104,128,152].map(x => `<path d="M${x} 122 L${x} 80" class="s-pale" stroke-width="2.5" marker-end="url(#${p}-pale)"/>`).join("")}
       ${flow(p, "M60 76 L300 76", "pale")}
       <rect x="180" y="116" width="80" height="16" rx="8" class="faint pulse" style="stroke:var(--pale)"/>
       <text x="220" y="62" text-anchor="middle" class="ttl">chrbtová aorta → dozadu</text>
       <text x="200" y="152" text-anchor="middle" class="ttl">brušná cieva (pulzuje) → dopredu</text>
       <text x="112" y="172" text-anchor="middle" class="lbl">žiabrové štrbiny</text>

  }
  /* Stavovce: schéma ako obvod. Hore dýchací orgán, dole telo, v strede srdce. */
  return vertebrate(type, p, open, paint);
}

/* Časti schémy stavovcov: komory (ch) a cievy (sg) so správnymi farbami. */
function vertParts(type) {
  if (type === "fish") return {
    ch: [{ x: 96, y: 100, w: 168, h: 46, c: "deoxy", l1: "predsieň", l2: "pred ňou žilový splav" },
         { x: 96, y: 152, w: 168, h: 60, c: "deoxy", l1: "komora", l2: "za ňou tepnový násadec" }],
    sg: [{ d: "M126 272 H48 V123 H90", c: "deoxy", n: "žily z tela" },
         { d: "M96 182 H72 V38 H120", c: "deoxy", n: "tepna do žiabier" },
         { d: "M234 38 H312 V272 H240", c: "oxy", n: "chrbtová aorta" }]
  };
  const ch = [{ x: 96, y: 100, w: 80, h: 46, c: "deoxy", l1: "pravá", l2: "predsieň" },
              { x: 184, y: 100, w: 80, h: 46, c: "oxy", l1: "ľavá", l2: "predsieň" }];
  if (type === "four") ch.push({ x: 96, y: 152, w: 80, h: 60, c: "deoxy", l1: "pravá", l2: "komora" }, { x: 184, y: 152, w: 80, h: 60, c: "oxy", l1: "ľavá", l2: "komora" });
  else if (type === "rept") ch.push({ x: 96, y: 152, w: 84, h: 60, c: "mixb" }, { x: 180, y: 152, w: 84, h: 60, c: "mixr" });
  else ch.push({ x: 96, y: 152, w: 168, h: 60, c: "mix", l1: "komora", l2: "krv sa čiastočne mieša" });
  const outL = type === "four" ? "deoxy" : type === "rept" ? "mixb" : "mix";
  const outR = type === "four" ? "oxy" : type === "rept" ? "mixr" : "mix";
  return { ch, sg: [
    { d: "M126 272 H48 V123 H90", c: "deoxy", n: "duté žily" },
    { d: "M96 182 H72 V38 H120", c: outL, n: type === "amph" ? "pľúcnokožné tepny" : "pľúcnica" },
    { d: "M234 38 H288 V123 H270", c: "oxy", n: "pľúcne žily" },
    { d: "M264 182 H312 V272 H240", c: outR, n: type === "four" ? "aorta" : "oblúky aorty" }] };
}
const base = (c) => (c === "mixb" || c === "mixr") ? "mix" : c;

function vertebrate(type, p, open, paint) {
  const { ch, sg } = vertParts(type);
  const top = type === "fish" ? "Žiabre" : (type === "amph" ? "Pľúca a koža" : "Pľúca");
  let s = open("0 0 360 310", "Schéma srdca a krvných obehov") +
    box(126, 20, 108, 36, "organ", top) + box(126, 254, 108, 36, "organ", "Telo");
  ch.forEach((c, i) => {
    let cls = "ch-" + c.c, extra = "";
    if (paint) {
      const u = paint.ch[i];
      cls = (u ? "ch-" + u : "organ") + " paint" + (paint.checked && base(u) !== base(c.c) ? " bad" : "");
      extra = ` data-act="paint" data-part="ch${i}"`;
    }
    s += `<rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="7" class="${cls}" filter="url(#${p}-rough)"${extra}/>`;
    if (c.l1) s += `<text x="${c.x + c.w / 2}" y="${c.y + c.h / 2 - 2}" text-anchor="middle" class="ttl" pointer-events="none">${c.l1}</text><text x="${c.x + c.w / 2}" y="${c.y + c.h / 2 + 12}" text-anchor="middle" class="lbl" pointer-events="none">${c.l2}</text>`;
  });
  if (type === "four") s += `<line x1="180" y1="100" x2="180" y2="212" class="sept"/>`;
  else if (type === "rept") s += `<line x1="180" y1="100" x2="180" y2="146" class="sept"/><line x1="180" y1="212" x2="180" y2="176" class="sept"/>
      <text x="180" y="168" text-anchor="middle" class="ttl" pointer-events="none">komora</text><text x="180" y="226" text-anchor="middle" class="lbl">neúplná priehradka</text>`;
  else if (type === "amph") s += `<line x1="180" y1="100" x2="180" y2="146" class="sept"/>`;
  sg.forEach((g, i) => {
    if (!paint) { s += flow(p, g.d, g.c); return; }
    const u = paint.sg[i], c = u || "blank";
    const bad = paint.checked && base(u) !== base(g.c);
    s += `<path d="${g.d}" class="track s-${c}${bad ? " bad" : ""}"/><path d="${g.d}" class="${u ? "flow" : "track"} s-${c}" style="opacity:1" marker-end="url(#${p}-${c})"/>
          <path d="${g.d}" class="hit" data-act="paint" data-part="sg${i}"><title>${g.n}</title></path>`;
  });
  if (type === "fish") s += vlabel(38, 200, "žily z tela") + vlabel(84, 78, "do žiabier") + vlabel(326, 160, "chrbtová aorta") +
      `<text x="180" y="240" text-anchor="middle" class="lbl">jeden obeh</text>`;
  else s += vlabel(38, 200, "duté žily") + vlabel(84, 78, type === "amph" ? "pľúcnokožné t." : "pľúcnica") +
      vlabel(300, 78, "pľúcne žily") + vlabel(326, 200, type === "four" ? "aorta" : "oblúky aorty") +
      `<text x="180" y="80" text-anchor="middle" class="lbl">malý (pľúcny) obeh</text>` +
      (type !== "rept" ? `<text x="180" y="240" text-anchor="middle" class="lbl">veľký (telový) obeh</text>` : "");
  return s + "</svg>";
}
const LEG = { deoxy: "odkysličená krv", oxy: "okysličená krv", mix: "zmiešaná krv" };
const legend = (keys) => keys ? `<div class="legend">${keys.map(k => `<span><i style="background:var(--${k})"></i>${LEG[k]}</span>`).join("")}</div>` : "";

/* ---------- Stanica ---------- */
function stationSteps(st) {
  return [...(ui.warm ? ["warm"] : []), "intro", "diagram", ...(VERT.includes(st.diagram) ? ["color"] : []), "points", "why",
    ...st.checks.map((_, i) => "check" + i), "cloze", "teach", "done"];
}
function optsHtml(opts, chosen, answer, name) {
  return `<div class="opts">${opts.map((o, i) => {
    let cls = "";
    if (chosen != null) cls = o.i === answer ? "right" : (i === chosen ? "wrong" : "dim");
    const mark = chosen != null && o.i === answer ? `<span class="mark" aria-hidden="true">✓</span>` : "";
    return `<button class="opt ${cls}" data-act="${name}" data-i="${i}" ${chosen != null ? "disabled" : ""}>${mark}<span class="k">${"abc"[i]})${i === chosen ? ring() : ""}</span><span class="txt">${o.t}</span></button>`;
  }).join("")}</div>`;
}
const verdict = (ok, good, bad) => `<span class="verdict">${ok ? good : bad}</span>`;
function clozeParts(id) {
  const c = CLOZE[id], answers = [], parts = c.t.split(/\{([^}]+)\}/);
  parts.forEach((t, i) => { if (i % 2) answers.push(t); });
  return { parts, answers, bank: shuffle([...answers, ...c.x]) };
}
function stationView(id) {
  const st = STATIONS.find(s => s.id === id);
  if (!st) return go("");
  if (ui.view !== "st" + id) {
    const prev = STATIONS.filter(s => s.id < id && S.done[s.id]);
    let warm = null;
    if (prev.length) { const ps = prev[Math.floor(Math.random() * prev.length)]; const c = ps.checks[Math.floor(Math.random() * ps.checks.length)]; warm = { ...c, from: ps.short, opts: shuffle(c.o.map((t, i) => ({ t, i }))) }; }
    const cz = clozeParts(id);
    const nCh = VERT.includes(st.diagram) ? vertParts(st.diagram) : null;
    ui = { view: "st" + id, step: 0, warm, warmAns: null, pred: null, chk: {}, shown: false,
      predOpts: shuffle(st.predict.o.map((t, i) => ({ t, i }))),
      chkOpts: st.checks.map(c => shuffle(c.o.map((t, i) => ({ t, i })))),
      cz, fill: cz.answers.map(() => null), czChecked: false,
      paint: nCh ? { ch: nCh.ch.map(() => null), sg: nCh.sg.map(() => null), checked: false, solved: false } : null,
      pen: "deoxy", teach: "", teachChecked: false };
  }
  const steps = stationSteps(st), step = steps[ui.step];
  let body = "", canNext = true;
  const kicker = `<p class="kicker">Zastávka ${st.id} · ${st.short}</p>`;
  if (step === "warm") {
    const w = ui.warm, ch = ui.warmAns; canNext = ch != null;
    const ok = ch != null && w.opts[ch].i === w.a;
    body = `<header class="titleblock">${kicker}<h2>Rozcvička</h2></header>${methodHtml("warm")}<p class="kicker">Otázka zo zastávky ${w.from}</p><p class="q">${w.q}</p>
      ${optsHtml(w.opts, ch, w.a, "warm")}
      ${ch != null ? `<div class="feedback ${ok ? "good" : ""}">${verdict(ok, "Pamätáš si to!", "Toto si ešte zopakuj.")}${w.e}</div>` : ""}`;
  } else if (step === "intro") {
    canNext = ui.pred != null;
    const ok = canNext && ui.predOpts[ui.pred].i === st.predict.a;
    body = `<header class="titleblock"><p class="kicker">Zastávka ${st.id} z ${STATIONS.length}</p>
      <h2>${st.short}</h2>
      <p class="meta">${st.examples} · ${st.era} mil. rokov</p></header>
      <p class="lead">${st.lead}</p>
      <hr class="divider">
      ${methodHtml("intro")}
      <p class="q">${st.predict.q}</p>
      ${optsHtml(ui.predOpts, ui.pred, st.predict.a, "pred")}
      ${ui.pred != null ? `<div class="feedback ${ok ? "good" : ""}">${verdict(ok, "Dobrý tip!", "Vedľa, ale presne na to tip slúži.")}${st.predict.note}</div>` : ""}`;
  } else if (step === "diagram") {
    body = `${kicker}${methodHtml("diagram")}
      <figure><div class="diagram">${diagram(st.diagram)}</div>${legend(st.legend)}
      <figcaption><b>Obr. ${st.id}</b> ${st.caption}</figcaption></figure>`;
  } else if (step === "color") {
    const P = ui.paint, parts = vertParts(st.diagram);
    const pens = st.legend;
    const total = parts.ch.length + parts.sg.length;
    const right = parts.ch.filter((c, i) => base(P.ch[i]) === base(c.c)).length + parts.sg.filter((g, i) => base(P.sg[i]) === base(g.c)).length;
    const filled = P.ch.filter(Boolean).length + P.sg.filter(Boolean).length;
    canNext = P.checked;
    body = `<header class="titleblock">${kicker}<h2>Vyfarbi schému</h2></header>${methodHtml("color")}
      <p>Vyber pero a ťukaj na oddiely srdca a na cievy. Akú krv obsahujú?</p>
      <div class="palette">${pens.map(k => `<button class="${ui.pen === k ? "on" : ""}" data-act="pen" data-k="${k}"><i style="background:var(--${k})"></i>${LEG[k]}</button>`).join("")}</div>
      <figure><div class="diagram">${diagram(st.diagram, P.solved ? null : P)}</div>
      <figcaption><b>Obr. ${st.id}a</b> ${P.solved ? "Správne riešenie." : `Vyfarbené ${filled} z ${total}.`}</figcaption></figure>
      ${P.checked ? `<div class="feedback ${right === total ? "good" : ""}">${verdict(right === total, "Všetko sedí!", `${right} z ${total} správne`)}${right === total ? "Toto si už nakreslíš aj na písomke." : "Chybné časti sú označené červenou prerušovanou čiarou. Oprav ich, alebo si pozri riešenie."}</div>
        ${right < total ? `<div class="row"><button class="btn ghost" data-act="recheck">Skontrolovať znova</button><button class="btn ghost" data-act="solve">${P.solved ? "Späť na moje" : "Ukázať riešenie"}</button></div>` : ""}`
      : `<button class="btn ghost" data-act="checkpaint" ${filled < total ? "disabled" : ""}>${filled < total ? "Vyfarbi všetko a skontroluj" : "Skontrolovať"}</button>`}`;
  } else if (step === "points") {
    body = `<header class="titleblock">${kicker}<h2>Čo si zapamätať</h2></header>${methodHtml("points")}
      <ol class="points">${st.points.map(([t, d]) => `<li><span><strong class="term">${t}</strong><span class="def">${d}</span></span></li>`).join("")}</ol>
      <p class="meta">Príklady: ${st.examples}</p>`;
  } else if (step === "why") {
    body = `<header class="titleblock">${kicker}<h2>${st.why.q}</h2></header>${methodHtml("why")}
      ${ui.shown ? `<div class="feedback good">${verdict(true, "Vysvetlenie", "")}${st.why.a}</div>`
                 : `<div class="think"><p>Povedz si odpoveď v duchu alebo nahlas. Až potom si ju odkry.</p><button class="btn ghost" data-act="reveal">Odkryť vysvetlenie</button></div>`}`;
  } else if (step.startsWith("check")) {
    const k = +step.slice(5), c = st.checks[k], ch = ui.chk[k];
    canNext = ch != null;
    const ok = ch != null && ui.chkOpts[k][ch].i === c.a;
    body = `${methodHtml("check")}<p class="kicker">Otázka ${k + 1} z ${st.checks.length}</p><p class="q">${c.q}</p>
      ${optsHtml(ui.chkOpts[k], ch, c.a, "chk")}
      ${ch != null ? `<div class="feedback ${ok ? "good" : ""}">${verdict(ok, "Správne!", "Nie celkom.")}${c.e}</div>` : ""}`;
  } else if (step === "cloze") {
    const { parts, answers, bank } = ui.cz;
    canNext = ui.czChecked;
    let gi = -1;
    const text = parts.map((t, i) => {
      if (!(i % 2)) return t;
      gi++; const v = ui.fill[gi];
      let cls = v == null ? "empty" : "";
      let fix = "";
      if (ui.czChecked) { cls = v === answers[gi] ? "ok" : "no"; if (cls === "no") fix = `<span class="fix">${answers[gi]}</span>`; }
      return `<button class="gap ${cls}" data-act="ungap" data-g="${gi}" ${ui.czChecked ? "disabled" : ""}>${v ?? "…"}</button>${fix}`;
    }).join("");
    const used = ui.fill.filter(v => v != null);
    const right = ui.fill.filter((v, i) => v === answers[i]).length;
    body = `<header class="titleblock">${kicker}<h2>Doplň</h2></header>${methodHtml("cloze")}
      <p class="cloze">${text}</p>
      ${ui.czChecked ? `<div class="feedback ${right === answers.length ? "good" : ""}">${verdict(right === answers.length, "Bez chyby!", `${right} z ${answers.length}`)}${right === answers.length ? "" : "Správne slová sú dopísané červenou."}</div>`
        : `<div class="bank">${bank.map((w, i) => `<button class="tile" data-act="word" data-w="${i}" ${used.includes(w) && used.filter(x => x === w).length >= bank.filter(x => x === w).length ? "disabled" : ""}>${w}</button>`).join("")}</div>
           <p class="small muted">Ťukni na slovo, doplní sa do prvej voľnej medzery. Ťuknutím na medzeru slovo vrátiš.</p>
           <button class="btn ghost" data-act="checkcloze" ${used.length < answers.length ? "disabled" : ""}>Skontrolovať</button>`}`;
  } else if (step === "teach") {
    const keys = TEACH[st.id], txt = norm(ui.teach);
    const hits = keys.map(([, re]) => new RegExp(re).test(txt));
    body = `<header class="titleblock">${kicker}<h2>Vysvetli to spolužiakovi</h2></header>${methodHtml("teach")}
      <p>Spolužiak chýbal na hodine. Napíš mu dve-tri vety o tom, ako funguje obeh u skupiny <b>${st.short.toLowerCase()}</b>. Píš z hlavy, nepozeraj sa späť.</p>
      <textarea id="teach-${st.id}" data-input="teach" placeholder="Napríklad: Ryba má srdce…">${ui.teach}</textarea>
      ${ui.teachChecked ? `<div class="stack" style="gap:10px"><p class="method">Pojmy, ktoré by tam mali byť:</p>
         <ul class="checklist">${keys.map(([l], i) => `<li class="${hits[i] ? "hit" : "miss"}"><span class="m">${hits[i] ? "✓" : "✗"}</span><span>${l}</span></li>`).join("")}</ul>
         <p class="small muted">Kontrola hľadá len kľúčové slová, nie celý zmysel. Prečítaj si svoj text ešte raz a porovnaj ho s rámčekom na ďalšej strane.</p></div>`
        : `<div class="row"><button class="btn ghost" data-act="checkteach">Skontrolovať pojmy</button><button class="btn ghost" data-act="next" style="border-color:transparent">Preskočiť</button></div>`}`;
  } else {
    const right = st.checks.filter((c, k) => ui.chk[k] != null && ui.chkOpts[k][ui.chk[k]].i === c.a).length;
    S.done[st.id] = true; save();
    const nx = STATIONS.find(s => s.id === st.id + 1);
    body = `<p class="kicker">Zastávka ${st.id} hotová · ${right} z ${st.checks.length} otázok správne</p>
      <div class="remember-box"><span class="tag">Zapamätaj si</span><p class="remember">${st.remember}</p></div>
      <p class="muted">Zajtra si túto zastávku zopakuj v kartičkách. Rozcvička na ďalšej zastávke sa ťa na ňu možno spýta.</p>`;
    app.innerHTML = `${pageHead(steps.length)}<div class="stack">${body}</div>
      <div class="navbar"><a class="btn ghost" href="#">Obsah</a>${nx ? `<a class="btn" href="#stanica-${nx.id}">Ďalej: ${nx.short} →</a>` : `<a class="btn" href="#kvapka">Cesta kvapky →</a>`}</div>`;
    return;
  }
  app.innerHTML = `${pageHead(steps.length)}<div class="stack">${body}</div>
    <div class="navbar">
      ${ui.step === 0 ? `<a class="btn ghost" href="#">Obsah</a>` : `<button class="btn ghost" data-act="prev">← Späť</button>`}
      <button class="btn" data-act="next" ${canNext ? "" : "disabled"}>${canNext ? "Ďalej →" : "Najprv odpovedz"}</button>
    </div>
    <p class="kbd">klávesy a, b, c · Enter = ďalej</p>`;
}
function pageHead(n) { return `<div class="pagehead"><a href="#">← Obsah</a><span class="pageno">strana ${ui.step + 1} / ${n}</span></div>`; }

/* ---------- Cesta kvapky ---------- */
function dropView() {
  if (ui.view !== "drop") ui = { view: "drop", org: "clovek" };
  if (!ui.pool || ui.poolOrg !== ui.org) {
    const r = ROUTES[ui.org];
    ui.poolOrg = ui.org; ui.pos = 0; ui.err = 0; ui.hint = null;
    ui.pool = shuffle([...r.steps.map((s, i) => ({ t: s[0], id: "s" + i })), ...r.decoys.map((t, i) => ({ t, id: "d" + i }))]);
  }
  const r = ROUTES[ui.org], done = ui.pos >= r.steps.length;
  app.innerHTML = `<div class="stack">
    <p class="method"><b>poradie krokov</b>Poskladaj cestu krvi sám.</p>
    <h2>Cesta kvapky</h2>
    <div class="choice">${Object.entries(ROUTES).map(([k, v]) => `<button class="${k === ui.org ? "on" : ""}" data-act="org" data-k="${k}">${v.name}</button>`).join("")}</div>
    <p>${r.start} Ťukaj na zastávky v správnom poradí. Farba bodky ukazuje, akú krv kvapka práve nesie.</p>
    <ol class="path">
      ${r.steps.map((s, i) => i < ui.pos
        ? `<li><span class="n">${i + 1}.</span><span class="d" style="background:var(--${s[1]})"></span><span>${s[0]}</span></li>`
        : i === ui.pos && !done ? `<li class="slot"><span class="n">${i + 1}.</span><span class="d"></span><span class="txt">kam ďalej?</span></li>` : "").join("")}
    </ol>
    ${done ? `<div class="feedback good">${verdict(true, "Kvapka je späť na začiatku!", "")}${ui.err ? `Chyby: ${ui.err}. Skús to ešte raz bez chyby.` : "Bez jedinej chyby."}</div>
      <div class="row"><button class="btn" data-act="again">Ešte raz</button>${Object.keys(ROUTES).filter(k => k !== ui.org).map(k => `<button class="btn ghost" data-act="org" data-k="${k}">${ROUTES[k].name}</button>`).join("")}</div>`
    : `${ui.hint ? `<p class="hint">${ui.hint}</p>` : ""}
      <div class="pool">${ui.pool.filter(t => !t.used).map(t => `<button class="tile" data-act="tile" data-id="${t.id}">${t.t}</button>`).join("")}</div>
      <p class="small muted">Dve zastávky do tohto obehu nepatria.</p>`}
  </div>`;
}

/* ---------- Kam patrí ---------- */
function sortView() {
  if (ui.view !== "sort") ui = { view: "sort", list: shuffle(ANIMALS).slice(0, 12), i: 0, right: 0, pick: null };
  const total = ui.list.length;
  if (ui.i >= total) {
    app.innerHTML = `<div class="stack"><h2>Kam patrí? Výsledok</h2>
      <p class="animal">${ui.right} / ${total}</p>
      <p class="muted">${ui.right === total ? "Bez chyby, aj s výnimkami." : "Pozri si zastávky, kde si sa pomýlil, a skús nové kolo."}</p>
      <div class="row"><button class="btn" data-act="sortagain">Nové kolo</button><a class="btn ghost" href="#">Obsah</a></div></div>`;
    return;
  }
  const [name, cat, why] = ui.list[ui.i];
  const ok = ui.pick === cat;
  const opt = (c, k) => {
    let cls = ""; if (ui.pick != null) cls = k === cat ? "right" : (k === ui.pick ? "wrong" : "dim");
    const mark = ui.pick != null && k === cat ? `<span class="mark" aria-hidden="true">✓</span>` : "";
    return `<button class="opt ${cls}" data-act="cat" data-k="${k}" ${ui.pick != null ? "disabled" : ""}>${mark}<span class="k">${k + 1}${k === ui.pick ? ring() : ""}</span><span class="txt">${c}</span></button>`;
  };
  app.innerHTML = `<div class="stack">
    <p class="kicker">Kam patrí? · ${ui.i + 1} z ${total}</p>
    <p class="muted">Aký typ obehovej sústavy alebo srdca má</p>
    <p class="animal">${name}</p>
    <div class="cats"><div class="opts">${SORT_CATS.slice(0, 3).map((c, k) => opt(c, k)).join("")}</div><div class="opts">${SORT_CATS.slice(3).map((c, k) => opt(c, k + 3)).join("")}</div></div>
    ${ui.pick != null ? `<div class="feedback ${ok ? "good" : ""}">${verdict(ok, "Správne!", "Patrí do: " + SORT_CATS[cat])}${why}</div>` : ""}
    <div class="navbar"><a class="btn ghost" href="#">Obsah</a><button class="btn" data-act="sortnext" ${ui.pick == null ? "disabled" : ""}>Ďalej →</button></div>
  </div>`;
}

/* ---------- Kartičky ---------- */
function cardsView() {
  if (ui.view !== "cards") {
    const order = shuffle(CARDS.map((_, i) => i)).sort((a, b) => (S.boxes[a] || 0) - (S.boxes[b] || 0)).slice(0, 12);
    ui = { view: "cards", queue: order, flipped: false };
  }
  const counts = [0, 1, 2, 3].map(b => CARDS.filter((_, i) => Math.min(S.boxes[i] || 0, 3) === b).length);
  const head = `<p class="method"><b>opakovanie s odstupom</b>Čo vieš, uvidíš zriedka. Čo nevieš, vráti sa o chvíľu.</p>
    <h2>Kartičky</h2>
    <div class="boxes">${["nové", "1× vedel", "2× vedel", "vieš"].map((l, b) => `<div><b>${counts[b]}</b>${l}</div>`).join("")}</div>`;
  if (!ui.queue.length) {
    app.innerHTML = `<div class="stack">${head}<h3>Kolo hotové</h3><p>Najviac ti pomôže, keď sa vrátiš zajtra a potom o pár dní. Krátko a často je lepšie ako dlho naraz.</p>
      <div class="row"><button class="btn" data-act="cardsagain">Ďalšie kolo</button><a class="btn ghost" href="#">Obsah</a></div></div>`;
    return;
  }
  const i = ui.queue[0], [q, a] = CARDS[i];
  app.innerHTML = `<div class="stack">${head}
    <button class="flash" data-act="flip" aria-label="Otočiť kartičku">
      <span class="side">${ui.flipped ? "odpoveď" : "otázka č. " + (i + 1)}</span>
      <span class="fq">${q}</span>
      ${ui.flipped ? `<span class="fa">${a}</span>` : ""}
    </button>
    ${ui.flipped ? `<div class="row"><button class="btn ghost" style="flex:1" data-act="no">Ešte neviem</button><button class="btn" style="flex:1" data-act="yes">Vedel som</button></div>`
                 : `<p class="muted">Odpovedz nahlas alebo v duchu. Až potom otoč kartičku.</p>`}
    <p class="kbd">medzerník = otočiť · ← neviem · → viem</p>
  </div>`;
}

/* ---------- Písomka ---------- */
function testBank() { return [...STATIONS.flatMap(s => s.checks.map(c => ({ ...c, s: s.id }))), ...EXTRA_TEST]; }
const gradeOf = (r) => r >= 11 ? 1 : r >= 9 ? 2 : r >= 7 ? 3 : r >= 5 ? 4 : 5;
function testView() {
  if (ui.view !== "test") {
    const qs = shuffle(testBank()).slice(0, 12).map(q => ({ ...q, opts: shuffle(q.o.map((t, i) => ({ t, i }))) }));
    ui = { view: "test", qs, i: 0, ans: [] };
  }
  const total = ui.qs.length;
  if (ui.i >= total) {
    const right = ui.qs.filter((q, k) => q.opts[ui.ans[k]].i === q.a).length;
    if (S.best == null || right > S.best) { S.best = right; save(); }
    const missed = ui.qs.map((q, k) => ({ q, k })).filter(({ q, k }) => q.opts[ui.ans[k]].i !== q.a);
    const toReview = [...new Set(missed.map(m => m.q.s))].sort((a, b) => a - b);
    app.innerHTML = `<div class="stack">
      <h2>Písomka</h2>
      <div class="grade"><div class="mk"><svg viewBox="0 0 104 104" aria-hidden="true"><path d="M78 16 C60 2 20 6 10 40 C0 76 34 100 64 94 C96 86 104 50 86 26 C80 18 70 12 58 11"/></svg>${gradeOf(right)}</div>
        <div><p class="pts">${right} / ${total} bodov</p><p class="muted">${right >= 11 ? "Výborne. Toto učivo máš v hlave." : right >= 7 ? "Dobre. Zopakuj si zastávky nižšie a skús to znova." : "Ešte to chce opakovanie. Prejdi si zastávky nižšie."}</p></div></div>
      ${toReview.length ? `<div class="row">${toReview.map(id => `<a class="btn ghost" href="#stanica-${id}">Zopakovať: ${STATIONS[id - 1].short}</a>`).join("")}</div>` : ""}
      ${missed.length ? `<h3>Oprava chýb</h3><ul class="miss-list">${missed.map(({ q }) => `<li><b>${q.q}</b><br><span class="fix">správne: ${q.o[q.a]}</span><br><span class="muted">${q.e}</span></li>`).join("")}</ul>` : ""}
      <div class="row"><button class="btn" data-act="testagain">Nová písomka</button><a class="btn ghost" href="#">Obsah</a></div>
    </div>`;
    return;
  }
  const q = ui.qs[ui.i], ch = ui.ans[ui.i];
  const ok = ch != null && q.opts[ch].i === q.a;
  app.innerHTML = `<div class="stack">
    <div class="pagehead"><a href="#">← Obsah</a><span class="pageno">otázka ${ui.i + 1} / ${total}</span></div>
    <p class="kicker">${STATIONS[q.s - 1].short}</p><p class="q">${q.q}</p>
    ${optsHtml(q.opts, ch, q.a, "test")}
    ${ch != null ? `<div class="feedback ${ok ? "good" : ""}">${verdict(ok, "Správne!", "Nie celkom.")}${q.e}</div>` : ""}
    <div class="navbar"><a class="btn ghost" href="#">Obsah</a><button class="btn" data-act="testnext" ${ch == null ? "disabled" : ""}>${ui.i === total - 1 ? "Známka →" : "Ďalej →"}</button></div>
    <p class="kbd">klávesy a, b, c · Enter = ďalej</p>
  </div>`;
}

    </table></div>
    <div class="rule"><h3>Tepna verzus žila</h3>
      <p><b>Tepna</b> vedie krv <b>zo</b> srdca, <b>žila</b> <b>do</b> srdca. O kyslíku to nehovorí nič.</p>
      <p class="muted">Pľúcnica je tepna s odkysličenou krvou, pľúcne žily vedú okysličenú krv.</p></div>
    <div class="rule"><h3>Dva obehy človeka</h3>
      <p><b>Malý:</b> pravá komora → pľúcnica → pľúca → pľúcne žily → ľavá predsieň.</p>
      <p><b>Veľký:</b> ľavá komora → aorta → telo → duté žily → pravá predsieň.</p>
      <p class="muted">Obeh začína v komore a končí v predsieni.</p></div>
    <div class="rule"><h3>Smer krvi: kto má čo naopak</h3>
      <p><b>Dážďovka:</b> chrbtom dopredu, bruchom dozadu.</p>
      <p><b>Kopijovec a stavovce:</b> bruchom dopredu (tam je srdce), chrbtom dozadu (aorta).</p></div>
    <a class="btn ghost" href="#">← Obsah</a>
  </div>`;
}

/* =========================================================
   ROUTER + UDALOSTI
   ========================================================= */
function render() {
  const h = location.hash.slice(1);
  const m = h.match(/^stanica-(\d+)$/);
  if (m) stationView(+m[1]);
  else if (h === "kvapka") dropView();
  else if (h === "triedenie") sortView();
  else if (h === "karticky") cardsView();
  else if (h === "test") testView();
  else if (h === "tahak") sheetView();
  else { if (ui.view !== "home") ui = { view: "home" }; homeView(); }
}
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
window.addEventListener("hashchange", () => { ui.view = null; render(); window.scrollTo(0, 0); });

function act(a, el) {
  const id = +(location.hash.match(/stanica-(\d+)/) || [])[1];
  const st = STATIONS.find(s => s.id === id);
  switch (a) {
    case "warm": if (ui.warmAns == null) { ui.warmAns = +el.dataset.i; rerender(); } break;
    case "pred": if (ui.pred == null) { ui.pred = +el.dataset.i; rerender(); } break;
    case "chk": { const k = +stationSteps(st)[ui.step].slice(5); if (ui.chk[k] == null) { ui.chk[k] = +el.dataset.i; rerender(); } break; }
    case "reveal": ui.shown = true; rerender(); break;
    case "next": ui.step++; render(); window.scrollTo(0, 0); break;
    case "prev": ui.step = Math.max(0, ui.step - 1); render(); window.scrollTo(0, 0); break;
    case "pen": ui.pen = el.dataset.k; rerender(); break;
    case "paint": {
      const P = ui.paint; if (P.solved) break;
      const part = el.dataset.part, kind = part.slice(0, 2), i = +part.slice(2);
      P[kind][i] = P[kind][i] === ui.pen ? null : ui.pen; rerender(); break;
    }
    case "checkpaint": case "recheck": ui.paint.checked = true; ui.paint.solved = false; rerender(); break;
    case "solve": ui.paint.solved = !ui.paint.solved; rerender(); break;
    case "word": { const g = ui.fill.indexOf(null); if (g >= 0) { ui.fill[g] = ui.cz.bank[+el.dataset.w]; rerender(); } break; }
    case "ungap": ui.fill[+el.dataset.g] = null; rerender(); break;
    case "checkcloze": ui.czChecked = true; rerender(); break;
    case "checkteach": ui.teachChecked = true; rerender(); break;
    case "org": ui.org = el.dataset.k; ui.pool = null; render(); break;
    case "again": ui.pool = null; render(); break;
    case "tile": {
      const r = ROUTES[ui.org], t = ui.pool.find(x => x.id === el.dataset.id), exp = r.steps[ui.pos];
      if (t.t === exp[0]) { t.used = true; ui.pos++; ui.hint = null; rerender(); }
      else {
        ui.err++; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
        const prev = ui.pos ? r.steps[ui.pos - 1][0] : null;
        ui.hint = `${t.t}? Teraz nie. ${prev ? "Kvapka je v časti <b>" + prev + "</b>. " : ""}${exp[2]}`;
        const hintEl = app.querySelector(".hint");
        if (hintEl) hintEl.innerHTML = ui.hint; else setTimeout(rerender, 360);
      }
      break;
    }
    case "cat": if (ui.pick == null) { ui.pick = +el.dataset.k; if (ui.pick === ui.list[ui.i][1]) ui.right++; rerender(); } break;
    case "sortnext": ui.i++; ui.pick = null; render(); break;
    case "sortagain": ui.view = null; render(); break;
    case "flip": ui.flipped = !ui.flipped; render(); break;
    case "yes": case "no": {
      const i = ui.queue.shift();
      if (a === "yes") S.boxes[i] = (S.boxes[i] || 0) + 1;
      else { S.boxes[i] = 0; ui.queue.splice(Math.min(3, ui.queue.length), 0, i); }
      save(); ui.flipped = false; render(); break;
    }
    case "cardsagain": ui.view = null; render(); break;
    case "test": if (ui.ans[ui.i] == null) { ui.ans[ui.i] = +el.dataset.i; rerender(); } break;
    case "testnext": ui.i++; render(); window.scrollTo(0, 0); break;
    case "testagain": ui.view = null; render(); break;
    case "copycode": {
      const code = backupCode(); ui.code = code; ui.backupOpen = true;
      const done = (ok) => { ui.backupMsg = ok ? "Kód je skopírovaný. Ulož si ho napríklad do poznámok." : "Kód je v poli nižšie. Označ ho a skopíruj."; rerender(); if (!ok) { const t = document.getElementById("backup-code"); t && t.select(); } };
      try { navigator.clipboard.writeText(code).then(() => done(true), () => done(false)); } catch (err) { done(false); }
      break;
    }
    case "restore":
      ui.backupOpen = true;
      try { restoreCode(ui.code || ""); ui.backupMsg = "Postup je obnovený."; } catch (err) { ui.backupMsg = "Tento kód nefunguje. Skopíruj ho celý, bez medzier navyše."; }
      rerender(); break;
  }
}
app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled) act(el.dataset.act, el);
});
app.addEventListener("input", (e) => { if (e.target.dataset.input === "teach") ui.teach = e.target.value; if (e.target.dataset.input === "code") ui.code = e.target.value; });
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = document.activeElement?.tagName;
  if (tag === "TEXTAREA" || tag === "INPUT") return;
  const k = e.key.toLowerCase();
  const idx = { a: 0, b: 1, c: 2, "1": 0, "2": 1, "3": 2, "4": 3, "5": 4, "6": 5 }[k];
  if (idx != null && ui.view !== "cards") {
    const opts = app.querySelectorAll(".opt:not([disabled])");
    if (opts[idx]) { opts[idx].click(); e.preventDefault(); }
    return;
  }
  if (k === "enter") {
    const n = app.querySelector('[data-act="next"].btn:not([disabled]):last-child, [data-act="testnext"]:not([disabled]), [data-act="sortnext"]:not([disabled])');
    if (n && tag !== "A" && tag !== "BUTTON") { n.click(); e.preventDefault(); }
  }
  if (ui.view === "cards") {
    if (k === " ") { act("flip"); e.preventDefault(); }
    if (ui.flipped && k === "arrowright") act("yes");
    if (ui.flipped && k === "arrowleft") act("no");
  }
});
render();
</script>
