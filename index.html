<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Srdce v čase</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interaktívna cesta vývojom obehovej sústavy živočíchov – od difúzie po štvordielne srdce.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: jeden úzky stĺpec ako učebnica vo vrecku; mapa = časová os, stanica = krokovaný výklad so schémou zapojenia ako elektrický obvod. */
:root {
  --paper: #F3F5F6;
  --surface: #FFFFFF;
  --ink: #14202A;
  --muted: #5A6872;
  --line: #D9E0E4;
  --oxy: #C61F3A;     /* okysličená krv */
  --deoxy: #2A57C4;   /* odkysličená krv */
  --mix: #7C47AE;     /* zmiešaná krv */
  --hemo: #A87D12;    /* hemolymfa */
  --pale: #8B979F;    /* bezfarebná krv */
  --ok: #1D8457;
  --bad: #C2410C;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E151B; --surface: #151F27; --ink: #E5ECEF; --muted: #93A2AC; --line: #26333D;
    --oxy: #FF5C70; --deoxy: #6F97FF; --mix: #B98CE8; --hemo: #E2B64B; --pale: #8D9BA5;
    --ok: #4CC58C; --bad: #F2904F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E151B; --surface: #151F27; --ink: #E5ECEF; --muted: #93A2AC; --line: #26333D;
  --oxy: #FF5C70; --deoxy: #6F97FF; --mix: #B98CE8; --hemo: #E2B64B; --pale: #8D9BA5;
  --ok: #4CC58C; --bad: #F2904F; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; padding-block: 20px 48px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 800; }
h2 { font-size: clamp(1.6rem, 5vw, 2.1rem); font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
b, strong { font-weight: 700; }
a { color: inherit; }
.mono, .eyebrow { font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
:focus-visible { outline: 3px solid var(--deoxy); outline-offset: 2px; border-radius: 6px; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 20px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; }
.brand svg { width: 26px; height: 26px; }
.toplinks { display: flex; gap: 6px; }
.toplink { font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: .05em; text-transform: uppercase; text-decoration: none; padding: 7px 10px; border-radius: 8px; color: var(--muted); }
.toplink:hover { background: var(--surface); color: var(--ink); }

/* Buttons */
button { font: inherit; color: inherit; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); font-weight: 700; cursor: pointer; text-decoration: none; transition: transform .12s ease; }
.btn:active { transform: scale(.98); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); }
.btn[disabled] { opacity: .35; cursor: not-allowed; }
.btn.wide { width: 100%; }

/* Home */
.hero { display: grid; gap: 18px; padding-block: 8px 28px; }
.hero h1 .beat { color: var(--oxy); }
.lede { font-size: 1.1rem; color: var(--muted); max-width: 34em; }
.progress-line { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.pips { display: flex; gap: 5px; }
.pip { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
.pip.on { background: var(--oxy); }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 36px 0 14px; }
.note { font-size: 0.92rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; max-width: 40em; }

.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 92px; top: 18px; bottom: 18px; width: 2px; background: var(--line); }
.stop a { display: grid; grid-template-columns: 76px 34px 1fr auto; align-items: center; gap: 0 10px; padding: 12px 10px 12px 0; text-decoration: none; border-radius: var(--r); }
.stop a:hover { background: var(--surface); }
.stop .era { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); text-align: right; line-height: 1.3; }
.stop .node { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); background: var(--paper); justify-self: center; position: relative; z-index: 1; }
.stop.done .node { background: var(--oxy); border-color: var(--oxy); }
.stop.next .node { border-color: var(--oxy); box-shadow: 0 0 0 5px color-mix(in srgb, var(--oxy) 18%, transparent); }
.stop .name { min-width: 0; }
.stop .name strong { display: block; font-family: var(--f-display); font-size: 1.08rem; }
.stop .name span { font-size: 0.9rem; color: var(--muted); }
.chip { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: .03em; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); white-space: nowrap; color: var(--muted); }

.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mode { display: flex; flex-direction: column; gap: 6px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; min-width: 0; }
.mode:hover { border-color: var(--ink); }
.mode h3 { display: flex; justify-content: space-between; gap: 8px; }
.mode p { font-size: 0.92rem; color: var(--muted); }
.mode .meta { margin-top: auto; padding-top: 8px; }
@media (max-width: 520px) {
  .modes { grid-template-columns: 1fr; }
  .stop a { grid-template-columns: 58px 26px 1fr; }
  .stop .chip { grid-column: 3; justify-self: start; margin-top: 4px; }
  .timeline::before { left: 70px; }
}

/* Station */
.bar { display: flex; gap: 4px; margin: 4px 0 22px; }
.bar i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.bar i.on { background: var(--ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 4vw, 28px); display: flex; flex-direction: column; gap: 18px; }
.card .lead { font-size: 1.08rem; }
.predict { border-top: 1px dashed var(--line); padding-top: 18px; display: flex; flex-direction: column; gap: 12px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--paper); cursor: pointer; line-height: 1.4; }
.opt:hover:not([disabled]) { border-color: var(--ink); }
.opt .k { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); padding-top: 3px; min-width: 1em; }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--surface)); }
.opt.dim { opacity: .55; }
.feedback { padding: 14px 16px; border-radius: var(--r); background: var(--paper); font-size: .97rem; }
.feedback strong { display: block; font-family: var(--f-display); margin-bottom: 2px; }
.feedback.good strong { color: var(--ok); }
.feedback.miss strong { color: var(--bad); }
.points { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; }
.points li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
.points li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--oxy); margin-top: 9px; }
.diagram { width: 100%; overflow-x: auto; }
.diagram svg { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 4px; border-radius: 2px; display: inline-block; }
.hidden-answer { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 16px; }
.remember { font-family: var(--f-display); font-size: clamp(1.4rem, 4.5vw, 1.9rem); font-weight: 700; line-height: 1.2; }
.navbar { position: sticky; bottom: 0; display: flex; gap: 10px; justify-content: space-between; padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--paper) 70%, transparent); margin-top: 18px; }
.navbar .btn { flex: 1; max-width: 220px; }
.navbar .btn:last-child { margin-left: auto; }
.kbd { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); text-align: center; margin-top: 6px; }
@media (hover: none) { .kbd { display: none; } }

/* SVG schemes */
.sv text { font-family: var(--f-body); fill: var(--ink); font-size: 12px; }
.sv .lbl { font-family: var(--f-mono); font-size: 9.5px; fill: var(--muted); letter-spacing: .02em; }
.sv .ttl { font-weight: 700; font-size: 12.5px; }
.sv .organ { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
.sv .wall { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.sv .faint { fill: color-mix(in srgb, var(--ink) 4%, var(--surface)); stroke: var(--line); stroke-width: 1.5; }
.sv .sept { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.sv .ch-oxy { fill: color-mix(in srgb, var(--oxy) 16%, var(--surface)); stroke: var(--oxy); stroke-width: 1.5; }
.sv .ch-deoxy { fill: color-mix(in srgb, var(--deoxy) 16%, var(--surface)); stroke: var(--deoxy); stroke-width: 1.5; }
.sv .ch-mix { fill: color-mix(in srgb, var(--mix) 18%, var(--surface)); stroke: var(--mix); stroke-width: 1.5; }
.sv .ch-mixb { fill: color-mix(in srgb, color-mix(in srgb, var(--deoxy) 65%, var(--mix)) 18%, var(--surface)); stroke: color-mix(in srgb, var(--deoxy) 65%, var(--mix)); stroke-width: 1.5; }
.sv .ch-mixr { fill: color-mix(in srgb, color-mix(in srgb, var(--oxy) 65%, var(--mix)) 18%, var(--surface)); stroke: color-mix(in srgb, var(--oxy) 65%, var(--mix)); stroke-width: 1.5; }
.sv .ch-hemo { fill: color-mix(in srgb, var(--hemo) 22%, var(--surface)); stroke: var(--hemo); stroke-width: 1.5; }
.sv .track { fill: none; stroke-width: 4; stroke-linejoin: round; opacity: .28; }
.sv .flow { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 11; animation: flow 1.1s linear infinite; }
.sv .s-oxy { stroke: var(--oxy); } .sv .f-oxy { fill: var(--oxy); }
.sv .s-deoxy { stroke: var(--deoxy); } .sv .f-deoxy { fill: var(--deoxy); }
.sv .s-mix { stroke: var(--mix); } .sv .f-mix { fill: var(--mix); }
.sv .s-mixb { stroke: color-mix(in srgb, var(--deoxy) 65%, var(--mix)); } .sv .f-mixb { fill: color-mix(in srgb, var(--deoxy) 65%, var(--mix)); }
.sv .s-mixr { stroke: color-mix(in srgb, var(--oxy) 65%, var(--mix)); } .sv .f-mixr { fill: color-mix(in srgb, var(--oxy) 65%, var(--mix)); }
.sv .s-hemo { stroke: var(--hemo); } .sv .f-hemo { fill: var(--hemo); }
.sv .s-pale { stroke: var(--pale); } .sv .f-pale { fill: var(--pale); }
.sv .s-ink { stroke: var(--muted); } .sv .f-ink { fill: var(--muted); }
.sv .pulse { animation: pulse 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.sv .dot { animation: drift 2.6s ease-out infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }
@keyframes pulse { 50% { transform: scale(1.12); } }
@keyframes drift { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; } }

/* Games */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; cursor: pointer; font-weight: 700; }
.tab.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.path { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; counter-reset: s; }
.path li { display: grid; grid-template-columns: 28px 14px 1fr; align-items: center; gap: 10px; padding: 6px 0; position: relative; }
.path li .n { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); text-align: right; }
.path li .d { width: 12px; height: 12px; border-radius: 50%; }
.path li.slot .d { border: 2px dashed var(--line); }
.path li.slot span:last-child { color: var(--muted); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.tile:hover { border-color: var(--ink); }
.tile.shake { animation: shake .35s; border-color: var(--bad); }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.hint { font-size: .95rem; padding: 12px 14px; border-radius: var(--r); background: color-mix(in srgb, var(--bad) 8%, var(--surface)); }

.animal { font-family: var(--f-display); font-size: clamp(2rem, 8vw, 2.8rem); font-weight: 800; }
.cats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.cats .opt { min-width: 0; }
@media (max-width: 480px) { .cats { grid-template-columns: 1fr; } }

.flash { min-height: 260px; cursor: pointer; justify-content: center; text-align: center; align-items: center; user-select: none; }
.flash .q { font-family: var(--f-display); font-size: clamp(1.3rem, 4.5vw, 1.7rem); font-weight: 700; line-height: 1.25; max-width: 22em; }
.flash .a { font-size: 1.08rem; max-width: 30em; }
.boxes { display: flex; gap: 6px; align-items: flex-end; height: 44px; }
.boxes div { flex: 1; background: var(--line); border-radius: 4px 4px 0 0; position: relative; min-height: 3px; }
.boxes div.lit { background: var(--ok); }
.boxlbl { display: flex; gap: 6px; } .boxlbl span { flex: 1; text-align: center; font-family: var(--f-mono); font-size: .66rem; color: var(--muted); }

.score { font-family: var(--f-display); font-size: clamp(3rem, 12vw, 4.5rem); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.miss-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.miss-list li { padding: 14px 16px; border-radius: var(--r); background: var(--paper); font-size: .95rem; }

/* Cheat sheet */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: .9rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 700; }
.mnemo { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.mnemo div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 10px; text-align: center; }
.mnemo b { display: block; font-family: var(--f-display); font-size: 2rem; line-height: 1; }
.mnemo span { font-size: .85rem; color: var(--muted); }
@media (max-width: 480px) { .mnemo { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.rule { padding: 18px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .sv .flow { stroke-dasharray: none; }
}
</style>
</head>

<script>
/* =========================================================
   OBSAH
   ========================================================= */
const STATIONS = [
{
  id: 1, short: "Bez obehovej sústavy", chip: "difúzia", era: "> 600",
  group: "Hubky, pŕhlivce, ploskavce", examples: "hubka, nezmar, medúza, planária",
  lead: "Najjednoduchšie živočíchy obehovú sústavu nepotrebujú. Každá bunka leží blízko vody alebo tráviacej dutiny, takže látky k nej dorazia difúziou.",
  predict: { q: "Nezmar nemá srdce ani cievy. Ako sa kyslík dostane k jeho bunkám?",

{

  group: "Článkonožce a väčšina mäkkýšov", examples: "včela, rak, pavúk, slimák, mušľa",

let uid = 0;
function markers(p) {
  return `<defs>${["oxy","deoxy","mix","mixb","mixr","hemo","pale","ink"].map(c =>
    `<marker id="${p}-${c}" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" class="f-${c}"/></marker>`).join("")}</defs>`;
}
function flow(p, d, c) { return `<path d="${d}" class="track s-${c}"/><path d="${d}" class="flow s-${c}" marker-end="url(#${p}-${c})"/>`; }
function box(x, y, w, h, cls, l1, l2) {
  const cx = x + w / 2, cy = y + h / 2;
  const t = l2 ? `<text x="${cx}" y="${cy - 2}" text-anchor="middle" class="ttl">${l1}</text><text x="${cx}" y="${cy + 12}" text-anchor="middle" class="lbl">${l2}</text>`
               : `<text x="${cx}" y="${cy + 4}" text-anchor="middle" class="ttl">${l1}</text>`;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" class="${cls}"/>${t}`;
}
function vlabel(x, y, t, anchor = "middle") { return `<text x="${x}" y="${y}" class="lbl" text-anchor="${anchor}" transform="rotate(-90 ${x} ${y})">${t}</text>`; }

  <p class="note" style="margin-top:14px">Nie je to rebrík. Hmyz ani dážďovka nie sú naši predkovia, sú to iné vetvy s vlastnými riešeniami. Čísla udávajú približný vek najstarších fosílií skupiny.</p>

/* ---------- Stanica ---------- */
function stationSteps(st) {
  return ["intro", "diagram", "points", "why", ...st.checks.map((_, i) => "check" + i), "done"];
}
function optsHtml(opts, chosen, answer, name) {
  return `<div class="opts">${opts.map((o, i) => {
    let cls = "";
    if (chosen != null) cls = o.i === answer ? "right" : (i === chosen ? "wrong" : "dim");
    return `<button class="opt ${cls}" data-act="${name}" data-i="${i}" ${chosen != null ? "disabled" : ""}><span class="k">${"ABC"[i]}</span><span>${o.t}</span></button>`;
  }).join("")}</div>`;
}
function stationView(id) {
  const st = STATIONS.find(s => s.id === id);
  if (!st) return go("");
  if (ui.view !== "st" + id) {
    ui = { view: "st" + id, step: 0, pred: null, chk: {}, shown: false,
      predOpts: shuffle(st.predict.o.map((t, i) => ({ t, i }))),
      chkOpts: st.checks.map(c => shuffle(c.o.map((t, i) => ({ t, i })))) };
  }
  const steps = stationSteps(st), step = steps[ui.step];
  let body = "", canNext = true;
  if (step === "intro") {
    const answered = ui.pred != null;
    canNext = answered;
    const correct = answered && ui.predOpts[ui.pred].i === st.predict.a;
    body = `<div class="card">
      <span class="eyebrow">Zastávka ${st.id} z ${STATIONS.length} · vek skupiny ${st.era} mil. r.</span>
      <h2>${st.short}</h2>
      <p class="muted">${st.group}: ${st.examples}</p>
      <p class="lead">${st.lead}</p>
      <div class="predict">
        <span class="eyebrow">Najprv tipni, aj keď to nevieš</span>
        <h3>${st.predict.q}</h3>
        ${optsHtml(ui.predOpts, ui.pred, st.predict.a, "pred")}
        ${answered ? `<div class="feedback ${correct ? "good" : "miss"}"><strong>${correct ? "Dobrý odhad." : "Tentoraz nie, a to je v poriadku."}</strong>${st.predict.note}</div>` : ""}
      </div></div>`;
  } else if (step === "diagram") {
    body = `<div class="card"><span class="eyebrow">Schéma</span><h2>${st.short}</h2>
      <div class="diagram">${diagram(st.diagram)}</div>${legend(st.legend)}<p class="muted">${st.caption}</p></div>`;
  } else if (step === "points") {
    body = `<div class="card"><span class="eyebrow">Čo si zapamätať</span><h2>${st.short}</h2>
      <ul class="points">${st.points.map(p => `<li><span>${p}</span></li>`).join("")}</ul></div>`;
  } else if (step === "why") {
    body = `<div class="card"><span class="eyebrow">Prečo to tak je?</span><h2>${st.why.q}</h2>
      ${ui.shown ? `<div class="feedback good"><strong>Vysvetlenie</strong>${st.why.a}</div>`
                 : `<div class="hidden-answer stack"><p class="muted">Skús si odpoveď povedať v duchu alebo nahlas. Vysvetľovanie vlastnými slovami je jeden z najúčinnejších spôsobov učenia.</p><button class="btn ghost" data-act="reveal">Ukázať vysvetlenie</button></div>`}
    </div>`;
  } else if (step.startsWith("check")) {
    const k = +step.slice(5), c = st.checks[k], ch = ui.chk[k];
    canNext = ch != null;
    const correct = ch != null && ui.chkOpts[k][ch].i === c.a;
    body = `<div class="card"><span class="eyebrow">Over si · otázka ${k + 1} z ${st.checks.length}</span><h2>${c.q}</h2>
      ${optsHtml(ui.chkOpts[k], ch, c.a, "chk")}
      ${ch != null ? `<div class="feedback ${correct ? "good" : "miss"}"><strong>${correct ? "Správne." : "Nie celkom."}</strong>${c.e}</div>` : ""}</div>`;
  } else {
    const right = st.checks.filter((c, k) => ui.chk[k] != null && ui.chkOpts[k][ui.chk[k]].i === c.a).length;
    S.done[st.id] = true; save();
    const nx = STATIONS.find(s => s.id === st.id + 1);
    body = `<div class="card"><span class="eyebrow">Zastávka hotová · ${right} z ${st.checks.length} správne</span>
      <p class="remember">${st.remember}</p>
      <p class="muted">Túto vetu si zopakuj zajtra. Pomôžu ti s tým kartičky.</p></div>`;
    app.innerHTML = `${barHtml(steps.length)}${body}
      <div class="navbar"><a class="btn ghost" href="#">Mapa</a>${nx ? `<a class="btn" href="#stanica-${nx.id}">Ďalej: ${nx.short} →</a>` : `<a class="btn" href="#kvapka">Cesta kvapky →</a>`}</div>`;
    return;
  }
  app.innerHTML = `${barHtml(steps.length)}${body}
    <div class="navbar">
      ${ui.step === 0 ? `<a class="btn ghost" href="#">Mapa</a>` : `<button class="btn ghost" data-act="prev">Späť</button>`}
      <button class="btn" data-act="next" ${canNext ? "" : "disabled"}>${canNext ? "Ďalej" : "Vyber odpoveď"}</button>
    </div>
    <p class="kbd">klávesy A B C · Enter = ďalej</p>`;
}
function barHtml(n) { return `<div class="bar" aria-hidden="true">${Array.from({ length: n }, (_, i) => `<i class="${i <= ui.step ? "on" : ""}"></i>`).join("")}</div>`; }

/* ---------- Cesta kvapky ---------- */
function dropView() {
  if (ui.view !== "drop") ui = { view: "drop", org: "clovek" };
  if (!ui.pool || ui.poolOrg !== ui.org) {
    const r = ROUTES[ui.org];
    ui.poolOrg = ui.org; ui.pos = 0; ui.err = 0; ui.hint = null;
    ui.pool = shuffle([...r.steps.map((s, i) => ({ t: s[0], id: "s" + i })), ...r.decoys.map((t, i) => ({ t, id: "d" + i }))]);
  }
  const r = ROUTES[ui.org], done = ui.pos >= r.steps.length;
  app.innerHTML = `
  <div class="stack">
    <span class="eyebrow">Hra · Cesta kvapky</span>
    <h2>Preveď kvapku krvi celým obehom</h2>
    <div class="tabs">${Object.entries(ROUTES).map(([k, v]) => `<button class="tab ${k === ui.org ? "on" : ""}" data-act="org" data-k="${k}">${v.name}</button>`).join("")}</div>
    <div class="card">
      <p class="muted">${r.start} Ťukaj na zastávky v správnom poradí. Farba bodky ukazuje, akú krv kvapka práve nesie.</p>
      <ol class="path">
        ${r.steps.map((s, i) => i < ui.pos
          ? `<li><span class="n">${i + 1}</span><span class="d" style="background:var(--${s[1]})"></span><span>${s[0]}</span></li>`
          : i === ui.pos ? `<li class="slot"><span class="n">${i + 1}</span><span class="d"></span><span>?</span></li>` : "").join("")}
      </ol>
      ${done ? `<div class="feedback good"><strong>Kvapka je späť na začiatku. Obeh je uzavretý.</strong>${ui.err ? `Chyby: ${ui.err}. Skús to ešte raz bez chyby.` : "Bez jedinej chyby."}</div>
        <div class="row"><button class="btn" data-act="again">Ešte raz</button>${Object.keys(ROUTES).filter(k => k !== ui.org).map(k => `<button class="btn ghost" data-act="org" data-k="${k}">${ROUTES[k].name}</button>`).join("")}</div>`
      : `${ui.hint ? `<div class="hint">${ui.hint}</div>` : ""}
        <div class="pool">${ui.pool.filter(t => !t.used).map(t => `<button class="tile" data-act="tile" data-id="${t.id}">${t.t}</button>`).join("")}</div>`}
    </div>
    <p class="muted" style="font-size:.9rem">Medzi zastávkami sú aj dve, ktoré do tohto obehu nepatria.</p>
  </div>`;
}

/* ---------- Kam patrí ---------- */
function sortView() {
  if (ui.view !== "sort") ui = { view: "sort", list: shuffle(ANIMALS).slice(0, 12), i: 0, right: 0, pick: null };
  const total = ui.list.length;
  if (ui.i >= total) {
    app.innerHTML = `<div class="card"><span class="eyebrow">Kam patrí? · výsledok</span>
      <div class="score">${ui.right}<span class="muted" style="font-size:.4em"> / ${total}</span></div>
      <p class="muted">${ui.right === total ? "Bez chyby, aj s výnimkami." : "Pozri si zastávky, kde si sa pomýlil(a), a skús znova."}</p>
      <div class="row"><button class="btn" data-act="sortagain">Nové kolo</button><a class="btn ghost" href="#">Mapa</a></div></div>`;
    return;
  }
  const [name, cat, why] = ui.list[ui.i];
  const ok = ui.pick === cat;
  app.innerHTML = `<div class="stack">
    <span class="eyebrow">Hra · Kam patrí? · ${ui.i + 1} / ${total}</span>
    <div class="card">
      <span class="muted">Aký typ obehovej sústavy alebo srdca má</span>
      <div class="animal">${name}</div>
      <div class="cats">${SORT_CATS.map((c, k) => {
        let cls = ""; if (ui.pick != null) cls = k === cat ? "right" : (k === ui.pick ? "wrong" : "dim");
        return `<button class="opt ${cls}" data-act="cat" data-k="${k}" ${ui.pick != null ? "disabled" : ""}><span class="k">${k + 1}</span><span>${c}</span></button>`; }).join("")}</div>
      ${ui.pick != null ? `<div class="feedback ${ok ? "good" : "miss"}"><strong>${ok ? "Správne." : "Patrí do: " + SORT_CATS[cat]}</strong>${why}</div>` : ""}

}

/* ---------- Kartičky ---------- */
function cardsView() {
  if (ui.view !== "cards") {
    const order = shuffle(CARDS.map((_, i) => i)).sort((a, b) => (S.boxes[a] || 0) - (S.boxes[b] || 0)).slice(0, 12);
    ui = { view: "cards", queue: order, flipped: false, seen: 0 };
  }
  const counts = [0, 1, 2, 3].map(b => CARDS.filter((_, i) => Math.min(S.boxes[i] || 0, 3) === b).length);
  const head = `<span class="eyebrow">Kartičky · opakovanie s rozostupmi</span>
    <div><div class="boxes">${counts.map((c, b) => `<div class="${b === 3 ? "lit" : ""}" style="height:${4 + (c / CARDS.length) * 40}px" title="${c}"></div>`).join("")}</div>
    <div class="boxlbl"><span>nové ${counts[0]}</span><span>1× ${counts[1]}</span><span>2× ${counts[2]}</span><span>vieš ${counts[3]}</span></div></div>`;
  if (!ui.queue.length) {
    app.innerHTML = `<div class="stack">${head}<div class="card"><h2>Kolo hotové</h2><p class="muted">Kartičky, ktoré si vedel(a), sa posunuli ďalej a ukážu sa zriedkavejšie. Najlepšie je vrátiť sa zajtra.</p>
      <div class="row"><button class="btn" data-act="cardsagain">Ďalšie kolo</button><a class="btn ghost" href="#">Mapa</a></div></div></div>`;
    return;
  }
  const i = ui.queue[0], [q, a] = CARDS[i];
  app.innerHTML = `<div class="stack">${head}
    <button class="card flash" data-act="flip" aria-label="Otočiť kartičku">
      <span class="mono">${ui.flipped ? "odpoveď" : "otázka · ťukni pre odpoveď"}</span>
      <span class="q">${q}</span>
      ${ui.flipped ? `<span class="a">${a}</span>` : ""}
    </button>
    ${ui.flipped ? `<div class="row" style="justify-content:space-between"><button class="btn ghost" style="flex:1" data-act="no">Ešte neviem</button><button class="btn" style="flex:1" data-act="yes">Viem</button></div>`
                 : `<p class="muted" style="text-align:center">Najprv si odpoveď povedz sám/sama, až potom otoč.</p>`}
    <p class="kbd">medzerník = otočiť · ← neviem · → viem</p>
  </div>`;
}

/* ---------- Skúška ---------- */
function testBank() {
  return [...STATIONS.flatMap(s => s.checks.map(c => ({ ...c, s: s.id }))), ...EXTRA_TEST];
}
function testView() {
  if (ui.view !== "test") {
    const qs = shuffle(testBank()).slice(0, 12).map(q => ({ ...q, opts: shuffle(q.o.map((t, i) => ({ t, i }))) }));
    ui = { view: "test", qs, i: 0, ans: [] };
  }
  const total = ui.qs.length;
  if (ui.i >= total) {
    const right = ui.qs.filter((q, k) => q.opts[ui.ans[k]].i === q.a).length;
    if (S.best == null || right > S.best) { S.best = right; save(); }
    const missed = ui.qs.map((q, k) => ({ q, k })).filter(({ q, k }) => q.opts[ui.ans[k]].i !== q.a);
    const toReview = [...new Set(missed.map(m => m.q.s))].sort((a, b) => a - b);
    app.innerHTML = `<div class="stack">
      <span class="eyebrow">Skúška · výsledok</span>
      <div class="score">${right}<span class="muted" style="font-size:.4em"> / ${total}</span></div>
      <p class="muted">${right >= 11 ? "Výborné. Toto učivo máš v hlave." : right >= 8 ? "Dobré. Zopakuj si zastávky nižšie a skús to znova." : "Ešte to chce opakovanie. Prejdi si zastávky nižšie."}</p>
      ${toReview.length ? `<div class="row">${toReview.map(id => `<a class="btn ghost" href="#stanica-${id}">Zopakovať: ${STATIONS[id - 1].short}</a>`).join("")}</div>` : ""}
      ${missed.length ? `<h3 style="margin-top:12px">Na tieto si daj pozor</h3><ul class="miss-list">${missed.map(({ q }) => `<li><b>${q.q}</b><br>Správne: ${q.o[q.a]}. <span class="muted">${q.e}</span></li>`).join("")}</ul>` : ""}
      <div class="row"><button class="btn" data-act="testagain">Nová skúška</button><a class="btn ghost" href="#">Mapa</a></div>
    </div>`;
    return;
  }
  const q = ui.qs[ui.i], ch = ui.ans[ui.i];
  const correct = ch != null && q.opts[ch].i === q.a;
  app.innerHTML = `<div class="stack">
    <div class="bar" aria-hidden="true">${ui.qs.map((_, k) => `<i class="${k <= ui.i ? "on" : ""}"></i>`).join("")}</div>
    <div class="card"><span class="eyebrow">Skúška · ${ui.i + 1} / ${total} · ${STATIONS[q.s - 1].short}</span><h2>${q.q}</h2>
      ${optsHtml(q.opts, ch, q.a, "test")}
      ${ch != null ? `<div class="feedback ${correct ? "good" : "miss"}"><strong>${correct ? "Správne." : "Nie celkom."}</strong>${q.e}</div>` : ""}</div>
    <div class="navbar"><a class="btn ghost" href="#">Mapa</a><button class="btn" data-act="testnext" ${ch == null ? "disabled" : ""}>${ui.i === total - 1 ? "Výsledok" : "Ďalej"}</button></div>
    <p class="kbd">klávesy A B C · Enter = ďalej</p>
  </div>`;
}

/* =========================================================
   ROUTER + UDALOSTI
   ========================================================= */
function render() {
  const h = location.hash.slice(1);
  const m = h.match(/^stanica-(\d+)$/);
  if (m) stationView(+m[1]);
  else if (h === "kvapka") dropView();
  else if (h === "triedenie") sortView();
  else if (h === "karticky") cardsView();
  else if (h === "test") testView();
  else if (h === "tahak") sheetView();
  else { ui = { view: "home" }; homeView(); }
}
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
window.addEventListener("hashchange", () => { ui.view = null; render(); window.scrollTo(0, 0); });

function act(a, el) {
  const id = +(location.hash.match(/stanica-(\d+)/) || [])[1];
  const st = STATIONS.find(s => s.id === id);
  switch (a) {
    case "pred": if (ui.pred == null) { ui.pred = +el.dataset.i; rerender(); } break;
    case "chk": { const k = +stationSteps(st)[ui.step].slice(5); if (ui.chk[k] == null) { ui.chk[k] = +el.dataset.i; rerender(); } break; }
    case "reveal": ui.shown = true; rerender(); break;
    case "next": ui.step++; render(); window.scrollTo(0, 0); break;
    case "prev": ui.step = Math.max(0, ui.step - 1); render(); window.scrollTo(0, 0); break;
    case "org": ui.org = el.dataset.k; ui.pool = null; render(); break;
    case "again": ui.pool = null; render(); break;
    case "tile": {
      const r = ROUTES[ui.org], t = ui.pool.find(x => x.id === el.dataset.id), exp = r.steps[ui.pos];
      if (t.t === exp[0]) {
        t.used = true; ui.pos++; ui.hint = null; rerender();
      } else {
        ui.err++; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
        const prev = ui.pos ? r.steps[ui.pos - 1][0] : null;
        ui.hint = `<b>${t.t}</b> teraz nie. ${prev ? "Kvapka je v časti <b>" + prev + "</b>. " : ""}${exp[2]}`;
        const hintEl = app.querySelector(".hint");
        if (hintEl) hintEl.innerHTML = ui.hint; else setTimeout(rerender, 360);
      }
      break;
    }
    case "cat": if (ui.pick == null) { ui.pick = +el.dataset.k; if (ui.pick === ui.list[ui.i][1]) ui.right++; rerender(); } break;
    case "sortnext": ui.i++; ui.pick = null; render(); break;
    case "sortagain": ui.view = null; render(); break;
    case "flip": ui.flipped = !ui.flipped; render(); break;
    case "yes": case "no": {
      const i = ui.queue.shift();
      if (a === "yes") S.boxes[i] = (S.boxes[i] || 0) + 1;
      else { S.boxes[i] = 0; ui.queue.splice(Math.min(3, ui.queue.length), 0, i); }
      save(); ui.flipped = false; render(); break;
    }
    case "cardsagain": ui.view = null; render(); break;
    case "test": if (ui.ans[ui.i] == null) { ui.ans[ui.i] = +el.dataset.i; rerender(); } break;
    case "testnext": ui.i++; render(); window.scrollTo(0, 0); break;
    case "testagain": ui.view = null; render(); break;
  }
}
app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled) act(el.dataset.act, el);
});
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const idx = { a: 0, b: 1, c: 2, "1": 0, "2": 1, "3": 2, "4": 3, "5": 4, "6": 5 }[k];
  if (idx != null) {
    const opts = app.querySelectorAll(".opt:not([disabled])");
    if (opts[idx]) { opts[idx].click(); e.preventDefault(); }
    return;
  }
  if (k === "enter") {
    const n = app.querySelector('[data-act="next"]:not([disabled]), [data-act="testnext"]:not([disabled]), [data-act="sortnext"]:not([disabled])');
    const tag = document.activeElement?.tagName;
    if (n && tag !== "A" && tag !== "BUTTON") { n.click(); e.preventDefault(); }
  }
  if (ui.view === "cards") {
    if (k === " ") { act("flip"); e.preventDefault(); }
    if (ui.flipped && k === "arrowright") act("yes");
    if (ui.flipped && k === "arrowleft") act("no");
  }
});
render();
</script>
