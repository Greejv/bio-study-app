<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Srdce v čase</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interaktívna cesta vývojom obehovej sústavy živočíchov – od difúzie po štvordielne srdce.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,500..900&family=Piazzolla:ital,opsz,wght@0,8..30,400..700;1,8..30,400&family=Shantell+Sans:wght@400..700&display=swap">
<style>
/* Layout: strana zo štvorčekového zošita z biológie. Vľavo okraj za červenou linkou na poznámky (roky, čísla strán, opravy),
   vpravo text ako v učebnici. Svetlý režim = zošit, tmavý režim = školská tabuľa. */
:root {
  --paper: #FCFCFA;
  --grid: #DCE7F1;
  --margin: #E26A6A;
  --ink: #1C1C1F;
  --muted: #5F646C;
  --pen: #1E3A8A;      /* plniace pero */
  --red: #C62828;      /* červené pero učiteľa */
  --green: #2E7D32;
  --hl: #FFE55C;       /* zvýrazňovač */
  --sheet: #FFFFFF;
  --oxy: #C8102E;
  --deoxy: #2F5CC7;
  --mix: #7B3FA8;
  --hemo: #A3780E;
  --pale: #8A939C;
  --f-head: "Anybody", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Piazzolla", Georgia, "Times New Roman", serif;
  --f-hand: "Shantell Sans", "Segoe Print", "Bradley Hand", cursive;
  --cell: 24px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1F2B26; --grid: #28362F; --margin: #9C4C4A; --ink: #ECECE4; --muted: #A9B4AD;
    --pen: #A8C6F2; --red: #FF8F85; --green: #A3D9A0; --hl: #6E6526; --sheet: #25332D;
    --oxy: #FF6B7A; --deoxy: #82A8FF; --mix: #C79DEB; --hemo: #E6C262; --pale: #9AA59F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1F2B26; --grid: #28362F; --margin: #9C4C4A; --ink: #ECECE4; --muted: #A9B4AD;
  --pen: #A8C6F2; --red: #FF8F85; --green: #A3D9A0; --hl: #6E6526; --sheet: #25332D;
  --oxy: #FF6B7A; --deoxy: #82A8FF; --mix: #C79DEB; --hemo: #E6C262; --pale: #9AA59F; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--paper); color: var(--ink);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: var(--cell) var(--cell);
  font-family: var(--f-body); font-size: 18px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; padding-block: 18px 40px; position: relative; padding-left: 76px; }
.wrap::before { content: ""; position: absolute; top: 0; bottom: 0; left: 60px; width: 2px; background: var(--margin); opacity: .7; }
@media (max-width: 560px) {
  .wrap { padding-left: 40px; }
  .wrap::before { left: 28px; }
}
h1, h2, h3 { font-family: var(--f-head); font-stretch: 70%; margin: 0; line-height: 1.05; text-wrap: balance; }
h1 { font-size: clamp(2.6rem, 9vw, 4.4rem); font-weight: 900; letter-spacing: -0.01em; }
h2 { font-size: clamp(1.6rem, 5.4vw, 2.2rem); font-weight: 800; text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 3px; text-underline-offset: 7px; text-decoration-skip-ink: none; }
h3 { font-size: 1.25rem; font-weight: 800; }
p { margin: 0; }
a { color: inherit; }
b, strong { font-weight: 700; }
.points b, .hl { background: linear-gradient(100deg, transparent 2%, var(--hl) 4%, var(--hl) 96%, transparent 98%) 0 62% / 100% 58% no-repeat; padding: 0 2px; }
.hand { font-family: var(--f-hand); color: var(--pen); line-height: 1.25; }
.small { font-size: .9rem; }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 3px; }
.marg { position: absolute; left: -76px; width: 56px; text-align: right; font-family: var(--f-hand); color: var(--muted); font-size: .9rem; line-height: 1.2; }
@media (max-width: 560px) { .marg { left: -40px; width: 22px; font-size: .78rem; } }

/* hlavička strany */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 22px; border-bottom: 1.5px solid var(--ink); margin-bottom: 26px; }
.brand { font-family: var(--f-head); font-stretch: 70%; font-weight: 800; font-size: 1.1rem; text-decoration: none; letter-spacing: .01em; }
.brand span { color: var(--oxy); }
.toplinks { display: flex; gap: 16px; font-size: .95rem; }
.toplinks a { text-decoration: none; border-bottom: 1px solid currentColor; }
.toplinks a:hover { background: var(--hl); }

/* tlačidlá: hranaté, bez tieňov */
button { font: inherit; color: inherit; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 22px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); font-family: var(--f-head); font-stretch: 82%; font-weight: 800; font-size: 1.05rem; cursor: pointer; text-decoration: none; border-radius: 0; }
.btn:hover { background: var(--pen); border-color: var(--pen); }
.btn.ghost { background: var(--paper); color: var(--ink); }
.btn.ghost:hover { background: var(--hl); border-color: var(--ink); }
.btn[disabled] { opacity: .3; cursor: not-allowed; }
.btn.wide { width: 100%; }

/* domov */
.intro { display: grid; gap: 16px; padding-bottom: 12px; }
.subject { font-size: 1.15rem; }
.intro h1 .beat { color: var(--oxy); }
.lede { font-size: 1.12rem; max-width: 33em; }
.state { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.tally { font-family: var(--f-hand); color: var(--pen); font-size: 1.1rem; }
.sec { margin: 44px 0 16px; position: relative; }
.toc { list-style: none; margin: 0; padding: 0; }
.toc li { position: relative; border-bottom: 1px solid var(--grid); }
.toc a { display: flex; align-items: baseline; gap: 8px; padding: 12px 0; text-decoration: none; min-width: 0; }
.toc a:hover .t strong { background: var(--hl); }
.toc .num { font-family: var(--f-head); font-stretch: 70%; font-weight: 800; min-width: 1.4em; }
.toc .t { min-width: 0; flex: 0 1 auto; }
.toc .t strong { font-family: var(--f-head); font-stretch: 82%; font-weight: 700; font-size: 1.12rem; }
.toc .t small { display: block; font-size: .9rem; color: var(--muted); }
.toc .dots { flex: 1 1 20px; border-bottom: 2px dotted var(--muted); opacity: .5; transform: translateY(-6px); min-width: 16px; }
.toc .kind { font-style: italic; font-size: .95rem; white-space: nowrap; }
.toc .marg { top: 14px; }
.toc .tick { position: absolute; right: -4px; top: -2px; font-family: var(--f-hand); color: var(--red); font-size: 1.6rem; transform: rotate(-8deg); pointer-events: none; }
.toc li.done .kind { padding-right: 22px; }
.toc li.next .t strong { background: var(--hl); }
@media (max-width: 560px) { .toc .dots, .toc .kind { display: none; } }
.pen-note { font-family: var(--f-hand); color: var(--pen); font-size: 1.05rem; line-height: 1.35; max-width: 32em; transform: rotate(-.6deg); margin-top: 16px; }
.pen-note b { color: var(--red); font-weight: 700; }
.tasks { list-style: none; margin: 0; padding: 0; counter-reset: u; }
.tasks li { counter-increment: u; border-bottom: 1px solid var(--grid); }
.tasks a { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; padding: 14px 0; text-decoration: none; align-items: baseline; }
.tasks a::before { content: "Úloha " counter(u); font-family: var(--f-head); font-stretch: 70%; font-weight: 800; color: var(--red); white-space: nowrap; }
.tasks a:hover strong { background: var(--hl); }
.tasks strong { font-family: var(--f-head); font-stretch: 82%; font-size: 1.12rem; }
.tasks span { grid-column: 2; font-size: .95rem; color: var(--muted); }
.tasks em { grid-column: 3; grid-row: 1; font-family: var(--f-hand); font-style: normal; color: var(--pen); white-space: nowrap; }
@media (max-width: 560px) { .tasks a { grid-template-columns: 1fr; } .tasks span, .tasks em { grid-column: 1; grid-row: auto; } }

/* stanica */
.pagehead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 18px; }
.pagehead a { font-size: .95rem; }
.pageno { font-family: var(--f-hand); color: var(--muted); }
.kicker { font-style: italic; color: var(--muted); }
.lead { font-size: 1.15rem; }
.q { font-family: var(--f-head); font-stretch: 82%; font-weight: 800; font-size: 1.3rem; line-height: 1.2; }
.opts { display: flex; flex-direction: column; border-top: 1px solid var(--grid); }
.opt { position: relative; text-align: left; display: grid; grid-template-columns: 34px 1fr; align-items: baseline; padding: 13px 8px 13px 0; border: 0; border-bottom: 1px solid var(--grid); background: transparent; cursor: pointer; line-height: 1.4; }
.opt:hover:not([disabled]) { background: color-mix(in srgb, var(--hl) 45%, transparent); }
.opt .k { font-family: var(--f-head); font-stretch: 82%; font-weight: 800; position: relative; justify-self: center; }
.opt .ring { position: absolute; left: -9px; top: -7px; width: 34px; height: 34px; overflow: visible; pointer-events: none; }
.opt .ring path { fill: none; stroke: var(--pen); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw .45s ease-out forwards; }
.opt[disabled] { cursor: default; }
.opt.wrong .txt { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; }
.opt.dim { color: var(--muted); }
.opt .mark { position: absolute; left: -46px; top: 4px; font-family: var(--f-hand); font-size: 1.7rem; color: var(--red); line-height: 1; transform: rotate(-10deg); }
@media (max-width: 560px) { .opt .mark { left: -36px; font-size: 1.4rem; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
.feedback { font-size: 1rem; }
.feedback .verdict { display: block; font-family: var(--f-hand); font-size: 1.35rem; color: var(--red); line-height: 1.2; margin-bottom: 2px; }
.feedback.good .verdict { color: var(--green); }
.points { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; counter-reset: p; }
.points li { counter-increment: p; display: grid; grid-template-columns: 26px 1fr; }
.points li::before { content: counter(p) "."; font-family: var(--f-head); font-stretch: 70%; font-weight: 800; color: var(--red); }
figure { margin: 0; background: var(--sheet); border: 1.5px solid var(--ink); padding: 14px 14px 12px; }
figcaption { font-size: .95rem; margin-top: 10px; }
figcaption b { font-family: var(--f-head); font-stretch: 82%; }
.diagram { width: 100%; overflow-x: auto; }
.diagram svg { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .9rem; margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 22px; height: 4px; display: inline-block; }
.think { border: 2px dashed var(--pen); padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.remember-box { border: 2.5px solid var(--ink); background: var(--sheet); padding: 18px 20px 20px; position: relative; margin-top: 10px; }
.remember-box .tag { position: absolute; top: -14px; left: 14px; background: var(--paper); padding: 0 8px; font-family: var(--f-head); font-stretch: 70%; font-weight: 900; text-transform: uppercase; font-size: .9rem; letter-spacing: .04em; }
.remember { font-family: var(--f-hand); color: var(--pen); font-size: clamp(1.5rem, 5vw, 2rem); line-height: 1.25; }
.navbar { position: sticky; bottom: 0; display: flex; gap: 10px; justify-content: space-between; padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--paper); border-top: 1.5px solid var(--ink); margin-top: 26px; }
.navbar .btn { flex: 1; max-width: 230px; }
.navbar .btn:last-child { margin-left: auto; }
.kbd { font-size: .8rem; color: var(--muted); text-align: right; margin-top: 4px; font-style: italic; }
@media (hover: none) { .kbd { display: none; } }

/* schémy (SVG) */
.sv text { font-family: var(--f-body); fill: var(--ink); font-size: 12.5px; }
.sv .lbl { font-family: var(--f-hand); font-size: 12px; fill: var(--pen); }
.sv .ttl { font-family: var(--f-head); font-stretch: 82%; font-weight: 700; font-size: 13px; }
.sv .rough { filter: url(#rough); }
.sv .organ { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.6; }
.sv .wall { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.sv .faint { fill: color-mix(in srgb, var(--ink) 5%, var(--sheet)); stroke: var(--ink); stroke-width: 1.4; }
.sv .sept { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.sv .ch-oxy { fill: color-mix(in srgb, var(--oxy) 18%, var(--sheet)); stroke: var(--oxy); stroke-width: 1.6; }
.sv .ch-deoxy { fill: color-mix(in srgb, var(--deoxy) 18%, var(--sheet)); stroke: var(--deoxy); stroke-width: 1.6; }
.sv .ch-mix { fill: color-mix(in srgb, var(--mix) 20%, var(--sheet)); stroke: var(--mix); stroke-width: 1.6; }
.sv .ch-mixb { fill: color-mix(in srgb, color-mix(in srgb, var(--deoxy) 65%, var(--mix)) 20%, var(--sheet)); stroke: color-mix(in srgb, var(--deoxy) 65%, var(--mix)); stroke-width: 1.6; }
.sv .ch-mixr { fill: color-mix(in srgb, color-mix(in srgb, var(--oxy) 65%, var(--mix)) 20%, var(--sheet)); stroke: color-mix(in srgb, var(--oxy) 65%, var(--mix)); stroke-width: 1.6; }
.sv .ch-hemo { fill: color-mix(in srgb, var(--hemo) 24%, var(--sheet)); stroke: var(--hemo); stroke-width: 1.6; }
.sv .track { fill: none; stroke-width: 4.5; stroke-linejoin: round; opacity: .3; }
.sv .flow { fill: none; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 11; animation: flow 1.1s linear infinite; }
.sv .s-oxy { stroke: var(--oxy); } .sv .f-oxy { fill: var(--oxy); }
.sv .s-deoxy { stroke: var(--deoxy); } .sv .f-deoxy { fill: var(--deoxy); }
.sv .s-mix { stroke: var(--mix); } .sv .f-mix { fill: var(--mix); }
.sv .s-mixb { stroke: color-mix(in srgb, var(--deoxy) 65%, var(--mix)); } .sv .f-mixb { fill: color-mix(in srgb, var(--deoxy) 65%, var(--mix)); }
.sv .s-mixr { stroke: color-mix(in srgb, var(--oxy) 65%, var(--mix)); } .sv .f-mixr { fill: color-mix(in srgb, var(--oxy) 65%, var(--mix)); }
.sv .s-hemo { stroke: var(--hemo); } .sv .f-hemo { fill: var(--hemo); }
.sv .s-pale { stroke: var(--pale); } .sv .f-pale { fill: var(--pale); }
.sv .s-ink { stroke: var(--pen); } .sv .f-ink { fill: var(--pen); }
.sv .pulse { animation: pulse 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.sv .dot { animation: drift 2.6s ease-out infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }
@keyframes pulse { 50% { transform: scale(1.12); } }
@keyframes drift { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; } }

/* hry */
.choice { display: flex; gap: 18px; flex-wrap: wrap; font-family: var(--f-head); font-stretch: 82%; font-weight: 700; font-size: 1.1rem; }
.choice button { background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--muted); }
.choice button.on { color: var(--ink); text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 3px; text-underline-offset: 6px; }
.path { list-style: none; margin: 0; padding: 0; }
.path li { display: grid; grid-template-columns: 30px 16px 1fr; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--grid); }
.path li .n { font-family: var(--f-head); font-stretch: 70%; font-weight: 800; text-align: right; }
.path li .d { width: 13px; height: 13px; border-radius: 50%; }
.path li.slot .d { border: 2px dashed var(--muted); }
.path li.slot .txt { font-family: var(--f-hand); color: var(--muted); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { padding: 9px 13px; border: 1.5px solid var(--ink); background: var(--sheet); cursor: pointer; font-family: var(--f-head); font-stretch: 82%; font-weight: 700; font-size: 1rem; }
.tile:hover { background: var(--hl); }
.tile.shake { animation: shake .35s; border-color: var(--red); }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.hint { font-family: var(--f-hand); color: var(--red); font-size: 1.1rem; line-height: 1.35; }
.hint b { font-weight: 700; }
.animal { font-family: var(--f-head); font-stretch: 65%; font-size: clamp(2.4rem, 10vw, 3.6rem); font-weight: 900; line-height: 1; }
.cats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); column-gap: 18px; border-top: 1px solid var(--grid); }
.cats .opts { border: 0; }
@media (max-width: 520px) { .cats { grid-template-columns: 1fr; } }

/* kartotečný lístok */
.flash { position: relative; display: flex; flex-direction: column; gap: 14px; justify-content: center; min-height: 270px; padding: 46px 22px 26px; text-align: left; cursor: pointer; border: 1.5px solid var(--ink); background-color: var(--sheet); background-image: linear-gradient(var(--margin), var(--margin)), repeating-linear-gradient(transparent 0 31px, var(--grid) 31px 32px); background-size: 100% 2px, 100% 100%; background-position: 0 36px, 0 6px; background-repeat: no-repeat, repeat; width: 100%; user-select: none; }
.flash .side { position: absolute; top: 8px; left: 14px; font-family: var(--f-hand); color: var(--muted); font-size: .95rem; }
.flash .fq { font-family: var(--f-head); font-stretch: 82%; font-size: clamp(1.35rem, 4.6vw, 1.75rem); font-weight: 800; line-height: 1.22; }
.flash .fa { font-family: var(--f-hand); color: var(--pen); font-size: 1.3rem; line-height: 1.35; }
.boxes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1.5px solid var(--ink); }
.boxes div { padding: 8px 10px; border-right: 1px solid var(--ink); font-size: .85rem; }
.boxes div:last-child { border-right: 0; background: color-mix(in srgb, var(--green) 14%, transparent); }
.boxes b { display: block; font-family: var(--f-head); font-stretch: 70%; font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums; }

/* známka */
.grade { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.grade .mk { position: relative; width: 104px; height: 104px; display: grid; place-items: center; font-family: var(--f-hand); color: var(--red); font-size: 4.2rem; line-height: 1; transform: rotate(-6deg); }
.grade .mk svg { position: absolute; inset: 0; overflow: visible; }
.grade .mk path { fill: none; stroke: var(--red); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 340; stroke-dashoffset: 340; animation: draw .7s .15s ease-out forwards; }
.grade .pts { font-family: var(--f-hand); color: var(--red); font-size: 1.5rem; }
.miss-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.miss-list li { padding: 12px 0; border-bottom: 1px solid var(--grid); font-size: .98rem; }
.miss-list .fix { font-family: var(--f-hand); color: var(--red); font-size: 1.1rem; }

/* ťahák */
.tablewrap { overflow-x: auto; border: 1.5px solid var(--ink); background: var(--sheet); }
table { border-collapse: collapse; width: 100%; min-width: 660px; font-size: .92rem; }
th, td { text-align: left; padding: 9px 11px; border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent); vertical-align: top; }
th { font-family: var(--f-head); font-stretch: 75%; font-weight: 800; background: color-mix(in srgb, var(--ink) 6%, var(--sheet)); }
td:first-child { font-weight: 700; }
.mnemo { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; }
.mnemo div { display: flex; align-items: baseline; gap: 8px; }
.mnemo b { font-family: var(--f-hand); color: var(--red); font-size: 2.6rem; line-height: 1; }
.mnemo span { font-size: .95rem; }
.rule { border-left: 3px solid var(--red); padding: 2px 0 2px 16px; display: flex; flex-direction: column; gap: 6px; }
.tabcap { font-size: .95rem; }
.tabcap b { font-family: var(--f-head); font-stretch: 82%; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .sv .flow { stroke-dasharray: none; }
  .opt .ring path, .grade .mk path { stroke-dashoffset: 0; }
}
/* nové kroky učenia */
.method { font-family: var(--f-hand); color: var(--pen); font-size: .95rem; line-height: 1.3; }
.method b { color: var(--red); font-weight: 700; }
.palette { display: flex; gap: 8px; flex-wrap: wrap; }

function vertebrate(type, p, open, paint) {

    }
    s += `<rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="7" class="${cls}" filter="url(#${p}-rough)"${extra}/>`;
    if (c.l1) s += `<text x="${c.x + c.w / 2}" y="${c.y + c.h / 2 - 2}" text-anchor="middle" class="ttl" pointer-events="none">${c.l1}</text><text x="${c.x + c.w / 2}" y="${c.y + c.h / 2 + 12}" text-anchor="middle" class="lbl" pointer-events="none">${c.l2}</text>`;

      `<text x="180" y="80" text-anchor="middle" class="lbl">malý (pľúcny) obeh</text>` +

    return `<button class="opt ${cls}" data-act="${name}" data-i="${i}" ${chosen != null ? "disabled" : ""}>${mark}<span class="k">${"abc"[i]})${i === chosen ? ring() : ""}</span><span class="txt">${o.t}</span></button>`;

    const w = ui.warm, ch = ui.warmAns; canNext = ch != null;

    body = `${methodHtml("warm")}<h2>Rozcvička</h2><p class="kicker">Otázka zo zastávky ${w.from}</p><p class="q">${w.q}</p>
      ${optsHtml(w.opts, ch, w.a, "warm")}
      ${ch != null ? `<div class="feedback ${ok ? "good" : ""}">${verdict(ok, "Pamätáš si to!", "Toto si ešte zopakuj.")}${w.e}</div>` : ""}`;
  } else if (step === "intro") {
    canNext = ui.pred != null;
    const ok = canNext && ui.predOpts[ui.pred].i === st.predict.a;
    body = `<p class="kicker">Zastávka ${st.id} z ${STATIONS.length} · vek skupiny ${st.era} mil. rokov</p>
      <h2>${st.short}</h2>
      <p class="muted">${st.group}: ${st.examples}</p>
      <p class="lead">${st.lead}</p>
      ${methodHtml("intro")}
      <p class="q">${st.predict.q}</p>
      ${optsHtml(ui.predOpts, ui.pred, st.predict.a, "pred")}
      ${ui.pred != null ? `<div class="feedback ${ok ? "good" : ""}">${verdict(ok, "Dobrý tip!", "Vedľa, ale presne na to tip slúži.")}${st.predict.note}</div>` : ""}`;
  } else if (step === "diagram") {
    body = `${methodHtml("diagram")}${kicker}
      <figure><div class="diagram">${diagram(st.diagram)}</div>${legend(st.legend)}
      <figcaption><b>Obr. ${st.id}</b> ${st.caption}</figcaption></figure>`;
  } else if (step === "color") {
    const P = ui.paint, parts = vertParts(st.diagram);
    const pens = st.legend;
    const total = parts.ch.length + parts.sg.length;
    const right = parts.ch.filter((c, i) => base(P.ch[i]) === base(c.c)).length + parts.sg.filter((g, i) => base(P.sg[i]) === base(g.c)).length;
    const filled = P.ch.filter(Boolean).length + P.sg.filter(Boolean).length;
    canNext = P.checked;
    body = `${methodHtml("color")}<h2>Vyfarbi schému</h2>
      <p>Vyber pero a ťukaj na oddiely srdca a na cievy. Akú krv obsahujú?</p>
      <div class="palette">${pens.map(k => `<button class="${ui.pen === k ? "on" : ""}" data-act="pen" data-k="${k}"><i style="background:var(--${k})"></i>${LEG[k]}</button>`).join("")}</div>
      <figure><div class="diagram">${diagram(st.diagram, P.solved ? null : P)}</div>
      <figcaption><b>Obr. ${st.id}a</b> ${P.solved ? "Správne riešenie." : `Vyfarbené ${filled} z ${total}.`}</figcaption></figure>
      ${P.checked ? `<div class="feedback ${right === total ? "good" : ""}">${verdict(right === total, "Všetko sedí!", `${right} z ${total} správne`)}${right === total ? "Toto si už nakreslíš aj na písomke." : "Chybné časti sú označené červenou prerušovanou čiarou. Oprav ich, alebo si pozri riešenie."}</div>
        ${right < total ? `<div class="row"><button class="btn ghost" data-act="recheck">Skontrolovať znova</button><button class="btn ghost" data-act="solve">${P.solved ? "Späť na moje" : "Ukázať riešenie"}</button></div>` : ""}`
      : `<button class="btn ghost" data-act="checkpaint" ${filled < total ? "disabled" : ""}>${filled < total ? "Vyfarbi všetko a skontroluj" : "Skontrolovať"}</button>`}`;
  } else if (step === "points") {
    body = `${methodHtml("points")}${kicker}<h2>Čo si zapamätať</h2>
      <ol class="points">${st.points.map(p => `<li><span>${p}</span></li>`).join("")}</ol>
      <p class="muted">Príklady: ${st.examples}.</p>`;
  } else if (step === "why") {
    body = `${methodHtml("why")}${kicker}<h2>${st.why.q}</h2>
      ${ui.shown ? `<div class="feedback good">${verdict(true, "Vysvetlenie", "")}${st.why.a}</div>`
                 : `<div class="think"><p>Povedz si odpoveď v duchu alebo nahlas. Až potom si ju odkry.</p><button class="btn ghost" data-act="reveal">Odkryť vysvetlenie</button></div>`}`;
  } else if (step.startsWith("check")) {
    const k = +step.slice(5), c = st.checks[k], ch = ui.chk[k];
    canNext = ch != null;
    const ok = ch != null && ui.chkOpts[k][ch].i === c.a;
    body = `${methodHtml("check")}<p class="kicker">Otázka ${k + 1} z ${st.checks.length}</p><p class="q">${c.q}</p>
      ${optsHtml(ui.chkOpts[k], ch, c.a, "chk")}
      ${ch != null ? `<div class="feedback ${ok ? "good" : ""}">${verdict(ok, "Správne!", "Nie celkom.")}${c.e}</div>` : ""}`;
  } else if (step === "cloze") {
    const { parts, answers, bank } = ui.cz;
    canNext = ui.czChecked;
    let gi = -1;
    const text = parts.map((t, i) => {
      if (!(i % 2)) return t;
      gi++; const v = ui.fill[gi];
      let cls = v == null ? "empty" : "";
      let fix = "";
      if (ui.czChecked) { cls = v === answers[gi] ? "ok" : "no"; if (cls === "no") fix = `<span class="fix">${answers[gi]}</span>`; }
      return `<button class="gap ${cls}" data-act="ungap" data-g="${gi}" ${ui.czChecked ? "disabled" : ""}>${v ?? "…"}</button>${fix}`;
    }).join("");
    const used = ui.fill.filter(v => v != null);
    const right = ui.fill.filter((v, i) => v === answers[i]).length;
    body = `${methodHtml("cloze")}<h2>Doplň</h2>
      <p class="cloze">${text}</p>
      ${ui.czChecked ? `<div class="feedback ${right === answers.length ? "good" : ""}">${verdict(right === answers.length, "Bez chyby!", `${right} z ${answers.length}`)}${right === answers.length ? "" : "Správne slová sú dopísané červenou."}</div>`
        : `<div class="bank">${bank.map((w, i) => `<button class="tile" data-act="word" data-w="${i}" ${used.includes(w) && used.filter(x => x === w).length >= bank.filter(x => x === w).length ? "disabled" : ""}>${w}</button>`).join("")}</div>
           <p class="small muted">Ťukni na slovo, doplní sa do prvej voľnej medzery. Ťuknutím na medzeru slovo vrátiš.</p>
           <button class="btn ghost" data-act="checkcloze" ${used.length < answers.length ? "disabled" : ""}>Skontrolovať</button>`}`;
  } else if (step === "teach") {
    const keys = TEACH[st.id], txt = norm(ui.teach);
    const hits = keys.map(([, re]) => new RegExp(re).test(txt));
    body = `${methodHtml("teach")}<h2>Vysvetli to spolužiakovi</h2>
      <p>Spolužiak chýbal na hodine. Napíš mu dve-tri vety o tom, ako funguje obeh u skupiny <b>${st.short.toLowerCase()}</b>. Píš z hlavy, nepozeraj sa späť.</p>
      <textarea id="teach-${st.id}" data-input="teach" placeholder="Napríklad: Ryba má srdce…">${ui.teach}</textarea>
      ${ui.teachChecked ? `<div class="stack" style="gap:10px"><p class="method">Pojmy, ktoré by tam mali byť:</p>
         <ul class="checklist">${keys.map(([l], i) => `<li class="${hits[i] ? "hit" : "miss"}"><span class="m">${hits[i] ? "✓" : "✗"}</span><span>${l}</span></li>`).join("")}</ul>
         <p class="small muted">Kontrola hľadá len kľúčové slová, nie celý zmysel. Prečítaj si svoj text ešte raz a porovnaj ho s rámčekom na ďalšej strane.</p></div>`
        : `<div class="row"><button class="btn ghost" data-act="checkteach">Skontrolovať pojmy</button><button class="btn ghost" data-act="next" style="border-color:transparent">Preskočiť</button></div>`}`;
  } else {
    const right = st.checks.filter((c, k) => ui.chk[k] != null && ui.chkOpts[k][ui.chk[k]].i === c.a).length;
    S.done[st.id] = true; save();
    const nx = STATIONS.find(s => s.id === st.id + 1);
    body = `<p class="kicker">Zastávka ${st.id} hotová · ${right} z ${st.checks.length} otázok správne</p>
      <div class="remember-box"><span class="tag">Zapamätaj si</span><p class="remember">${st.remember}</p></div>
      <p class="muted">Zajtra si túto zastávku zopakuj v kartičkách. Rozcvička na ďalšej zastávke sa ťa na ňu možno spýta.</p>`;
    app.innerHTML = `${pageHead(steps.length)}<div class="stack">${body}</div>
      <div class="navbar"><a class="btn ghost" href="#">Obsah</a>${nx ? `<a class="btn" href="#stanica-${nx.id}">Ďalej: ${nx.short} →</a>` : `<a class="btn" href="#kvapka">Cesta kvapky →</a>`}</div>`;
    return;
  }
  app.innerHTML = `${pageHead(steps.length)}<div class="stack">${body}</div>
    <div class="navbar">
      ${ui.step === 0 ? `<a class="btn ghost" href="#">Obsah</a>` : `<button class="btn ghost" data-act="prev">← Späť</button>`}
      <button class="btn" data-act="next" ${canNext ? "" : "disabled"}>${canNext ? "Ďalej →" : "Najprv odpovedz"}</button>
    </div>
    <p class="kbd">klávesy a, b, c · Enter = ďalej</p>`;
}
function pageHead(n) { return `<div class="pagehead"><a href="#">← Obsah</a><span class="pageno">strana ${ui.step + 1} / ${n}</span></div>`; }

/* ---------- Cesta kvapky ---------- */
function dropView() {
  if (ui.view !== "drop") ui = { view: "drop", org: "clovek" };
  if (!ui.pool || ui.poolOrg !== ui.org) {
    const r = ROUTES[ui.org];
    ui.poolOrg = ui.org; ui.pos = 0; ui.err = 0; ui.hint = null;
    ui.pool = shuffle([...r.steps.map((s, i) => ({ t: s[0], id: "s" + i })), ...r.decoys.map((t, i) => ({ t, id: "d" + i }))]);
  }
  const r = ROUTES[ui.org], done = ui.pos >= r.steps.length;
  app.innerHTML = `<div class="stack">
    <p class="method">metóda: <b>poradie krokov</b> · Keď vieš cestu krvi poskladať sám, rozumieš celému obehu.</p>
    <h2>Cesta kvapky</h2>
    <div class="choice">${Object.entries(ROUTES).map(([k, v]) => `<button class="${k === ui.org ? "on" : ""}" data-act="org" data-k="${k}">${v.name}</button>`).join("")}</div>
    <p>${r.start} Ťukaj na zastávky v správnom poradí. Farba bodky ukazuje, akú krv kvapka práve nesie.</p>
    <ol class="path">
      ${r.steps.map((s, i) => i < ui.pos
        ? `<li><span class="n">${i + 1}.</span><span class="d" style="background:var(--${s[1]})"></span><span>${s[0]}</span></li>`
        : i === ui.pos && !done ? `<li class="slot"><span class="n">${i + 1}.</span><span class="d"></span><span class="txt">kam ďalej?</span></li>` : "").join("")}
    </ol>
    ${done ? `<div class="feedback good">${verdict(true, "Kvapka je späť na začiatku!", "")}${ui.err ? `Chyby: ${ui.err}. Skús to ešte raz bez chyby.` : "Bez jedinej chyby."}</div>
      <div class="row"><button class="btn" data-act="again">Ešte raz</button>${Object.keys(ROUTES).filter(k => k !== ui.org).map(k => `<button class="btn ghost" data-act="org" data-k="${k}">${ROUTES[k].name}</button>`).join("")}</div>`
    : `${ui.hint ? `<p class="hint">${ui.hint}</p>` : ""}
      <div class="pool">${ui.pool.filter(t => !t.used).map(t => `<button class="tile" data-act="tile" data-id="${t.id}">${t.t}</button>`).join("")}</div>
      <p class="small muted">Dve zastávky do tohto obehu nepatria.</p>`}
  </div>`;
}

/* ---------- Kam patrí ---------- */
function sortView() {
  if (ui.view !== "sort") ui = { view: "sort", list: shuffle(ANIMALS).slice(0, 12), i: 0, right: 0, pick: null };
  const total = ui.list.length;
  if (ui.i >= total) {
    app.innerHTML = `<div class="stack"><h2>Kam patrí? Výsledok</h2>
      <p class="animal">${ui.right} / ${total}</p>
      <p class="muted">${ui.right === total ? "Bez chyby, aj s výnimkami." : "Pozri si zastávky, kde si sa pomýlil, a skús nové kolo."}</p>
      <div class="row"><button class="btn" data-act="sortagain">Nové kolo</button><a class="btn ghost" href="#">Obsah</a></div></div>`;
    return;
  }
  const [name, cat, why] = ui.list[ui.i];
  const ok = ui.pick === cat;
  const opt = (c, k) => {
    let cls = ""; if (ui.pick != null) cls = k === cat ? "right" : (k === ui.pick ? "wrong" : "dim");
    const mark = ui.pick != null && k === cat ? `<span class="mark" aria-hidden="true">✓</span>` : "";
    return `<button class="opt ${cls}" data-act="cat" data-k="${k}" ${ui.pick != null ? "disabled" : ""}>${mark}<span class="k">${k + 1}${k === ui.pick ? ring() : ""}</span><span class="txt">${c}</span></button>`;
  };
  app.innerHTML = `<div class="stack">
    <p class="method">metóda: <b>striedanie tém</b> · Živočíchy idú náhodne, aby si skupiny musel naozaj rozlišovať. ${ui.i + 1} / ${total}</p>
    <p class="muted">Aký typ obehovej sústavy alebo srdca má</p>
    <p class="animal">${name}</p>
    <div class="cats"><div class="opts">${SORT_CATS.slice(0, 3).map((c, k) => opt(c, k)).join("")}</div><div class="opts">${SORT_CATS.slice(3).map((c, k) => opt(c, k + 3)).join("")}</div></div>
    ${ui.pick != null ? `<div class="feedback ${ok ? "good" : ""}">${verdict(ok, "Správne!", "Patrí do: " + SORT_CATS[cat])}${why}</div>` : ""}
    <div class="navbar"><a class="btn ghost" href="#">Obsah</a><button class="btn" data-act="sortnext" ${ui.pick == null ? "disabled" : ""}>Ďalej →</button></div>
  </div>`;
}

/* ---------- Kartičky ---------- */
function cardsView() {
  if (ui.view !== "cards") {
    const order = shuffle(CARDS.map((_, i) => i)).sort((a, b) => (S.boxes[a] || 0) - (S.boxes[b] || 0)).slice(0, 12);
    ui = { view: "cards", queue: order, flipped: false };
  }
  const counts = [0, 1, 2, 3].map(b => CARDS.filter((_, i) => Math.min(S.boxes[i] || 0, 3) === b).length);
  const head = `<p class="method">metóda: <b>opakovanie s odstupom</b> · Kartička, ktorú vieš, sa posunie o priečinok ďalej a ukáže sa zriedkavejšie. Kartička, ktorú nevieš, sa vráti o chvíľu.</p>
    <h2>Kartičky</h2>
    <div class="boxes">${["nové", "1× vedel", "2× vedel", "vieš"].map((l, b) => `<div><b>${counts[b]}</b>${l}</div>`).join("")}</div>`;
  if (!ui.queue.length) {
    app.innerHTML = `<div class="stack">${head}<h3>Kolo hotové</h3><p>Najviac ti pomôže, keď sa vrátiš zajtra a potom o pár dní. Krátko a často je lepšie ako dlho naraz.</p>
      <div class="row"><button class="btn" data-act="cardsagain">Ďalšie kolo</button><a class="btn ghost" href="#">Obsah</a></div></div>`;
    return;
  }
  const i = ui.queue[0], [q, a] = CARDS[i];
  app.innerHTML = `<div class="stack">${head}
    <button class="flash" data-act="flip" aria-label="Otočiť kartičku">
      <span class="side">${ui.flipped ? "odpoveď" : "otázka č. " + (i + 1)}</span>
      <span class="fq">${q}</span>
      ${ui.flipped ? `<span class="fa">${a}</span>` : ""}
    </button>
    ${ui.flipped ? `<div class="row"><button class="btn ghost" style="flex:1" data-act="no">Ešte neviem</button><button class="btn" style="flex:1" data-act="yes">Vedel som</button></div>`
                 : `<p class="muted">Odpovedz nahlas alebo v duchu. Až potom otoč kartičku.</p>`}
    <p class="kbd">medzerník = otočiť · ← neviem · → viem</p>
  </div>`;
}

/* ---------- Písomka ---------- */
function testBank() { return [...STATIONS.flatMap(s => s.checks.map(c => ({ ...c, s: s.id }))), ...EXTRA_TEST]; }
const gradeOf = (r) => r >= 11 ? 1 : r >= 9 ? 2 : r >= 7 ? 3 : r >= 5 ? 4 : 5;
function testView() {
  if (ui.view !== "test") {
    const qs = shuffle(testBank()).slice(0, 12).map(q => ({ ...q, opts: shuffle(q.o.map((t, i) => ({ t, i }))) }));
    ui = { view: "test", qs, i: 0, ans: [] };
  }
  const total = ui.qs.length;
  if (ui.i >= total) {
    const right = ui.qs.filter((q, k) => q.opts[ui.ans[k]].i === q.a).length;
    if (S.best == null || right > S.best) { S.best = right; save(); }
    const missed = ui.qs.map((q, k) => ({ q, k })).filter(({ q, k }) => q.opts[ui.ans[k]].i !== q.a);
    const toReview = [...new Set(missed.map(m => m.q.s))].sort((a, b) => a - b);
    app.innerHTML = `<div class="stack">
      <h2>Písomka</h2>
      <div class="grade"><div class="mk"><svg viewBox="0 0 104 104" aria-hidden="true"><path d="M78 16 C60 2 20 6 10 40 C0 76 34 100 64 94 C96 86 104 50 86 26 C80 18 70 12 58 11"/></svg>${gradeOf(right)}</div>
        <div><p class="pts">${right} / ${total} bodov</p><p class="muted">${right >= 11 ? "Výborne. Toto učivo máš v hlave." : right >= 7 ? "Dobre. Zopakuj si zastávky nižšie a skús to znova." : "Ešte to chce opakovanie. Prejdi si zastávky nižšie."}</p></div></div>
      ${toReview.length ? `<div class="row">${toReview.map(id => `<a class="btn ghost" href="#stanica-${id}">Zopakovať: ${STATIONS[id - 1].short}</a>`).join("")}</div>` : ""}
      ${missed.length ? `<h3>Oprava chýb</h3><ul class="miss-list">${missed.map(({ q }) => `<li><b>${q.q}</b><br><span class="fix">správne: ${q.o[q.a]}</span><br><span class="muted">${q.e}</span></li>`).join("")}</ul>` : ""}
      <div class="row"><button class="btn" data-act="testagain">Nová písomka</button><a class="btn ghost" href="#">Obsah</a></div>
    </div>`;
    return;
  }
  const q = ui.qs[ui.i], ch = ui.ans[ui.i];
  const ok = ch != null && q.opts[ch].i === q.a;
  app.innerHTML = `<div class="stack">
    <div class="pagehead"><a href="#">← Obsah</a><span class="pageno">otázka ${ui.i + 1} / ${total}</span></div>
    <p class="method">metóda: <b>vybavovanie + striedanie</b> · Otázky zo všetkých zastávok namiešané.</p>
    <p class="kicker">${STATIONS[q.s - 1].short}</p><p class="q">${q.q}</p>
    ${optsHtml(q.opts, ch, q.a, "test")}
    ${ch != null ? `<div class="feedback ${ok ? "good" : ""}">${verdict(ok, "Správne!", "Nie celkom.")}${q.e}</div>` : ""}
    <div class="navbar"><a class="btn ghost" href="#">Obsah</a><button class="btn" data-act="testnext" ${ch == null ? "disabled" : ""}>${ui.i === total - 1 ? "Známka →" : "Ďalej →"}</button></div>
    <p class="kbd">klávesy a, b, c · Enter = ďalej</p>
  </div>`;
}

      <p class="muted">Pľúcnica je tepna s odkysličenou krvou, pľúcne žily vedú okysličenú krv.</p></div>
    <div class="rule"><h3>Dva obehy človeka</h3>
      <p><b>Malý:</b> pravá komora → pľúcnica → pľúca → pľúcne žily → ľavá predsieň.</p>
      <p><b>Veľký:</b> ľavá komora → aorta → telo → duté žily → pravá predsieň.</p>
      <p class="muted">Obeh začína v komore a končí v predsieni.</p></div>
    <div class="rule"><h3>Smer krvi: kto má čo naopak</h3>
      <p><b>Dážďovka:</b> chrbtom dopredu, bruchom dozadu.</p>
      <p><b>Kopijovec a stavovce:</b> bruchom dopredu (tam je srdce), chrbtom dozadu (aorta).</p></div>
    <a class="btn ghost" href="#">← Obsah</a>
  </div>`;
}

/* =========================================================
   ROUTER + UDALOSTI
   ========================================================= */
function render() {
  const h = location.hash.slice(1);
  const m = h.match(/^stanica-(\d+)$/);
  if (m) stationView(+m[1]);
  else if (h === "kvapka") dropView();
  else if (h === "triedenie") sortView();
  else if (h === "karticky") cardsView();
  else if (h === "test") testView();
  else if (h === "tahak") sheetView();
  else { ui = { view: "home" }; homeView(); }
}
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
window.addEventListener("hashchange", () => { ui.view = null; render(); window.scrollTo(0, 0); });

function act(a, el) {
  const id = +(location.hash.match(/stanica-(\d+)/) || [])[1];
  const st = STATIONS.find(s => s.id === id);
  switch (a) {
    case "warm": if (ui.warmAns == null) { ui.warmAns = +el.dataset.i; rerender(); } break;
    case "pred": if (ui.pred == null) { ui.pred = +el.dataset.i; rerender(); } break;
    case "chk": { const k = +stationSteps(st)[ui.step].slice(5); if (ui.chk[k] == null) { ui.chk[k] = +el.dataset.i; rerender(); } break; }
    case "reveal": ui.shown = true; rerender(); break;
    case "next": ui.step++; render(); window.scrollTo(0, 0); break;
    case "prev": ui.step = Math.max(0, ui.step - 1); render(); window.scrollTo(0, 0); break;
    case "pen": ui.pen = el.dataset.k; rerender(); break;
    case "paint": {
      const P = ui.paint; if (P.solved) break;
      const part = el.dataset.part, kind = part.slice(0, 2), i = +part.slice(2);
      P[kind][i] = P[kind][i] === ui.pen ? null : ui.pen; rerender(); break;
    }
    case "checkpaint": case "recheck": ui.paint.checked = true; ui.paint.solved = false; rerender(); break;
    case "solve": ui.paint.solved = !ui.paint.solved; rerender(); break;
    case "word": { const g = ui.fill.indexOf(null); if (g >= 0) { ui.fill[g] = ui.cz.bank[+el.dataset.w]; rerender(); } break; }
    case "ungap": ui.fill[+el.dataset.g] = null; rerender(); break;
    case "checkcloze": ui.czChecked = true; rerender(); break;
    case "checkteach": ui.teachChecked = true; rerender(); break;
    case "org": ui.org = el.dataset.k; ui.pool = null; render(); break;
    case "again": ui.pool = null; render(); break;
    case "tile": {
      const r = ROUTES[ui.org], t = ui.pool.find(x => x.id === el.dataset.id), exp = r.steps[ui.pos];
      if (t.t === exp[0]) { t.used = true; ui.pos++; ui.hint = null; rerender(); }
      else {
        ui.err++; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
        const prev = ui.pos ? r.steps[ui.pos - 1][0] : null;
        ui.hint = `${t.t}? Teraz nie. ${prev ? "Kvapka je v časti <b>" + prev + "</b>. " : ""}${exp[2]}`;
        const hintEl = app.querySelector(".hint");
        if (hintEl) hintEl.innerHTML = ui.hint; else setTimeout(rerender, 360);
      }
      break;
    }
    case "cat": if (ui.pick == null) { ui.pick = +el.dataset.k; if (ui.pick === ui.list[ui.i][1]) ui.right++; rerender(); } break;
    case "sortnext": ui.i++; ui.pick = null; render(); break;
    case "sortagain": ui.view = null; render(); break;
    case "flip": ui.flipped = !ui.flipped; render(); break;
    case "yes": case "no": {
      const i = ui.queue.shift();
      if (a === "yes") S.boxes[i] = (S.boxes[i] || 0) + 1;
      else { S.boxes[i] = 0; ui.queue.splice(Math.min(3, ui.queue.length), 0, i); }
      save(); ui.flipped = false; render(); break;
    }
    case "cardsagain": ui.view = null; render(); break;
    case "test": if (ui.ans[ui.i] == null) { ui.ans[ui.i] = +el.dataset.i; rerender(); } break;
    case "testnext": ui.i++; render(); window.scrollTo(0, 0); break;
    case "testagain": ui.view = null; render(); break;
  }
}
app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled) act(el.dataset.act, el);
});
app.addEventListener("input", (e) => { if (e.target.dataset.input === "teach") ui.teach = e.target.value; });
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = document.activeElement?.tagName;
  if (tag === "TEXTAREA" || tag === "INPUT") return;
  const k = e.key.toLowerCase();
  const idx = { a: 0, b: 1, c: 2, "1": 0, "2": 1, "3": 2, "4": 3, "5": 4, "6": 5 }[k];
  if (idx != null && ui.view !== "cards") {
    const opts = app.querySelectorAll(".opt:not([disabled])");
    if (opts[idx]) { opts[idx].click(); e.preventDefault(); }
    return;
  }
  if (k === "enter") {
    const n = app.querySelector('[data-act="next"].btn:not([disabled]):last-child, [data-act="testnext"]:not([disabled]), [data-act="sortnext"]:not([disabled])');
    if (n && tag !== "A" && tag !== "BUTTON") { n.click(); e.preventDefault(); }
  }
  if (ui.view === "cards") {
    if (k === " ") { act("flip"); e.preventDefault(); }
    if (ui.flipped && k === "arrowright") act("yes");
    if (ui.flipped && k === "arrowleft") act("no");
  }
});
render();
</script>
</body>
